<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>THE HELL</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--
  Cores: só variáveis dos tokens de data/art/palette.json (Art Bible §2, §8), aplicadas por src/hud/palette.ts.
  Textos: só chaves de tradução (data-i18n, src/i18n/locales), conferidas por `pnpm i18n:check`.
-->
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--ui-bg);color:var(--ui-text);font:calc(13px * var(--ui-scale,1))/1.4 "Courier New",monospace;overflow:hidden}
:focus-visible{outline:2px solid var(--ui-accent);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
#c{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated;background:var(--ui-bg)}
#vg{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 160px 50px var(--fx-ameaca);opacity:0}
.p{position:fixed;background:var(--ui-panel);padding:6px 10px;border:2px solid var(--ui-text-dim)}
#hud>*{position:fixed}
#me{left:calc(8px + env(safe-area-inset-left,0px));top:calc(8px + env(safe-area-inset-top,0px))}
#top{left:50%;transform:translateX(-50%);top:calc(8px + env(safe-area-inset-top,0px));text-align:center}
#top .hb .b{margin:4px auto}
#tm{right:calc(8px + env(safe-area-inset-right,0px));top:calc(8px + env(safe-area-inset-top,0px));min-width:210px;margin:0;list-style:none}
.pt{display:grid;grid-template-columns:20px 1fr;grid-template-areas:"ic nm" "ic st";column-gap:6px;padding:3px 0 3px 6px;border-left:4px solid var(--cc)}
.pt+.pt{margin-top:4px}
.pt .ci{grid-area:ic;color:var(--cc);align-self:center}.pt .nm{grid-area:nm;font-weight:bold}.pt .st{grid-area:st;display:flex;gap:4px;align-items:center}
.pt .you{font-weight:normal;color:var(--ui-text-dim)}
.c-healer{--cc:var(--class-curandeiro)}.c-mechanic{--cc:var(--class-mecanico)}.c-fighter{--cc:var(--class-atacador)}
.pt.wounded .st{color:var(--ui-danger)}.pt.caged .st{color:var(--fx-preso)}.pt.dead .st,.pt.escaped .st{color:var(--ui-text-dim)}
.pt.dead .nm{text-decoration:line-through}
#hint{text-align:center;max-width:90vw}
#msg{left:50%;transform:translateX(-50%);top:30%;font-size:calc(18px * var(--ui-scale,1));color:var(--ui-danger);text-shadow:0 0 6px var(--ui-bg);text-align:center}
#pings{left:calc(8px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:40vw}
#pf{margin:0;padding:0;list-style:none}#pf li{color:var(--ui-accent)}
#threat{color:var(--fx-ameaca);width:48px;height:48px;filter:drop-shadow(0 0 3px var(--ui-bg));animation:pulse 1s steps(2) infinite}
@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){#threat{animation:none}}
.reduce-flicker #threat{animation:none}
#spec{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
#spec h2{margin:0;font-size:calc(20px * var(--ui-scale,1));color:var(--ui-danger)}
.b{height:8px;background:var(--ui-bg);margin:3px 0;width:170px}.b i{display:block;height:100%}
.danger{color:var(--ui-danger)}
#pz{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);display:none;text-align:center;min-width:300px}
.bar{position:relative;height:22px;background:var(--ui-bg);margin:10px 0}.bar i{position:absolute;top:0;height:100%}
.zn{background:var(--gen-pronto)}.cu{background:var(--ui-text);width:4px}
.sq span{display:inline-block;font-size:calc(30px * var(--ui-scale,1));min-width:44px;margin:4px;border:2px solid var(--ui-text-dim)}.sq .ok{color:var(--gen-pronto);border-color:var(--gen-pronto)}
#menu,#end,#shop,#opts{position:fixed;inset:0;background:var(--ui-bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px;overflow:auto}
#end,#shop{display:none}
#menu p,#end p,#shop p,#opts p{margin:0}
h1{margin:0;font-size:calc(46px * var(--ui-scale,1));letter-spacing:8px;color:var(--ui-danger)}
#shop h1,#opts h1{font-size:calc(30px * var(--ui-scale,1))}
/* menu de opções (V8): seções em grade, controles nativos com a cor de destaque, foco sempre visível */
#opts{justify-content:flex-start}
.ogrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:10px;width:min(1180px,100%);text-align:left}
.osec{border:2px solid var(--ui-text-dim);background:var(--ui-panel);margin:0;padding:6px 10px 10px;min-width:0}
.osec>legend{color:var(--ui-accent);font-weight:bold;padding:0 4px}
.orow{display:grid;grid-template-columns:minmax(0,1fr) minmax(90px,40%) 4.5em;gap:6px;align-items:center;margin:4px 0}
.orow.ock{grid-template-columns:auto 1fr}.orow.ock .ohint{grid-column:2}
.orow.okey{grid-template-columns:minmax(0,1fr) auto}.orow.okey{margin:2px 0}.orow.okey button{min-width:7em;margin:0;padding:2px 10px}
.orow output{text-align:right;font-variant-numeric:tabular-nums}
.orow.olrow{display:block}.olangs{display:flex;flex-wrap:wrap;gap:2px;margin-top:2px}
#opts input{accent-color:var(--ui-accent);margin:0}#opts input[type=range]{width:100%;height:24px}
#opts input[type=checkbox],#opts input[type=radio]{width:max(24px,1.2em);height:max(24px,1.2em)}
.orad{border:0;padding:0;margin:6px 0;display:flex;flex-wrap:wrap;gap:4px 14px}.orad legend{padding:0;margin-bottom:2px}
.orad span{display:inline-flex;gap:6px;align-items:center}
.ohint{display:block}.opad{margin:4px 0 0;padding-left:18px}
button{background:var(--ui-panel);color:var(--ui-text);border:2px solid var(--ui-text-dim);padding:8px 16px;font:inherit;cursor:pointer;margin:3px}
button.on,button[aria-pressed="true"]{border-color:var(--ui-accent);color:var(--ui-accent)}button:hover{border-color:var(--ui-text)}
small,.dim{color:var(--ui-text-dim)}
#langs{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:center}
.sk{border:2px solid var(--ui-text-dim);padding:8px;min-width:130px;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--ui-panel)}.sk.on{border-color:var(--ui-accent)}#sg{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:720px;margin:20px 0}.sw{position:relative;width:46px;height:64px;margin-top:22px}.sw i{position:absolute;left:11px;top:-14px;width:24px;height:24px}.sw u{position:absolute;left:8px;top:-22px;width:30px;height:9px}
button:disabled{cursor:default;border-style:dashed}
button[aria-disabled="true"]{cursor:progress;border-style:dashed}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.sk button{white-space:nowrap}
/* MOCKUP A2b do modo Retro FPS (D-13; só com ?retro=1): barra de estado inferior, estilo de gênero anos 90 */
#sb{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;align-items:stretch;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));
  background:radial-gradient(circle at 5px 5px,var(--world-industrial-chapa) 1.5px,transparent 2px) 0 0/22px 22px,var(--world-industrial-parede);
  border-top:3px solid var(--world-industrial-chapa);box-shadow:0 -3px 0 var(--world-industrial-junta);font-weight:bold;text-transform:uppercase}
.sbs{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:4px 10px;background:var(--ui-panel);min-width:96px;
  border:3px solid;border-color:var(--ui-bg) var(--ui-text-dim) var(--ui-text-dim) var(--ui-bg)}
.sbs small{color:var(--ui-text-dim);font-size:11px;letter-spacing:1px;text-transform:none}.sbs>small:first-child{text-transform:uppercase}
.sbs .big{font-size:26px;line-height:1;letter-spacing:2px}.sbs .big.danger{color:var(--ui-danger)}
.sbm{height:8px;background:var(--ui-bg);width:100%;min-width:90px}.sbm i{display:block;height:100%}
.sb-me{flex-direction:row;align-items:center;gap:8px;font-size:15px}.sb-me .ci{color:var(--cc)}.sb-me .ci svg{width:32px;height:32px}
.sb-tm{flex:1}.sb-tm ul{display:flex;gap:4px;margin:0;padding:0;list-style:none}
.sb-tm .pt{display:flex;flex-direction:column;align-items:center;gap:1px;padding:2px 4px;border-left:0;border-bottom:3px solid var(--cc);font-size:10px;min-width:58px}
.sb-tm .pt+.pt{margin-top:0}.sb-tm .pt .nm{display:none}.sb-tm .pt .ci svg{width:20px;height:20px}
.c-protector{--cc:var(--class-protetor)}.c-scout{--cc:var(--class-batedor)}
body.retro #me,body.retro #top,body.retro #tm{display:none!important}
body.retro #pings{bottom:calc(104px + env(safe-area-inset-bottom,0px))}
/* legendas de som (V8b): centro embaixo, acima da dica (e da barra de estado no retro); sobe com o painel de espectador */
/* coluna do centro embaixo (V8b): legendas, painel de espectador e dica empilhados num só fluxo, sem sobreposição em
   qualquer tamanho de fonte ou de tela; no ?retro=1 a coluna começa acima da barra de estado */
#bot{left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;width:max-content;max-width:92vw;pointer-events:none}
#bot>.p{position:static;pointer-events:auto}
body.retro #bot{bottom:calc(104px + env(safe-area-inset-bottom,0px))}
/* a coluna sobe acima do painel de pings quando as larguras se cruzam (hud/layout.ts; 8px = o gap da coluna) */
#bot.lift{bottom:calc(14px + 8px + var(--pings-lift,0px) + env(safe-area-inset-bottom,0px))}
body.retro #bot.lift{bottom:calc(104px + 8px + var(--pings-lift,0px) + env(safe-area-inset-bottom,0px))}
#cap{max-width:min(92vw,46ch)}
#cap ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;align-items:center;gap:4px}
.cp{display:flex;align-items:center;gap:6px;max-width:100%;background:var(--ui-panel);color:var(--ui-text);border:2px solid var(--ui-text-dim);padding:3px 8px;overflow-wrap:anywhere}
.cp.hz{border-color:var(--ui-danger)}.cp.hz .ca{color:var(--ui-danger)}
.ca{flex:none;display:inline-flex;width:1.3em;height:1.3em}.ca svg{width:100%;height:100%}.cn{flex:none;color:var(--ui-accent);font-weight:bold}
</style></head><body>
<canvas id="c" role="img" data-i18n-aria-label="app.canvas"></canvas><div id="vg"></div>
<div id="hud" hidden>
<div id="me" class="p"></div>
<div id="top" class="p"></div>
<ul id="tm" class="p" data-i18n-aria-label="team.title"></ul>
<div id="msg" role="status" aria-live="polite"></div>
<div id="threat" role="img" hidden></div>
<div id="pings" class="p" role="group" data-i18n-aria-label="ping.title"><div id="pcd"></div><ul id="pf"></ul></div>
<div id="sb" role="group" data-i18n-aria-label="retro.bar" hidden></div>
<div id="bot">
<div id="cap" role="log" data-i18n-aria-label="hud.captions" aria-live="off" hidden></div>
<div id="spec" class="p" hidden><h2 id="spt"></h2><div id="spw"></div><button type="button" id="spn" data-i18n="spec.next"></button><small data-i18n="spec.note"></small></div>
<div id="hint" class="p" hidden></div>
</div>
</div>
<div id="pz" class="p"><div id="pzc"></div><button type="button" id="pzx" data-i18n="puzzle.exit"></button></div>
<main id="menu">
<h1 data-i18n="app.title"></h1>
<p id="sub"></p>
<div id="langs" role="group" data-i18n-aria-label="lang.label"></div>
<p id="choose" data-i18n="menu.choose_class"></p><div id="cls" role="group" aria-labelledby="choose"></div><p id="desc" aria-live="polite"></p>
<div><button type="button" id="go"><span aria-hidden="true">▶ </span><span id="gol" data-i18n="menu.start"></span></button><button type="button" id="sh" data-i18n="menu.shop"></button><button type="button" id="op" data-i18n="opt.open"></button></div>
<p id="gost" class="sr" role="status" aria-live="polite"></p>
<p id="co"></p>
<small data-i18n="menu.controls"></small>
<small id="goal"></small>
</main>
<div id="shop" role="dialog" aria-modal="true" aria-labelledby="shopt"></div>
<div id="opts" role="dialog" aria-modal="true" aria-labelledby="optt" hidden></div>
<div id="end" role="dialog" aria-modal="true" aria-labelledby="et" aria-describedby="es"><h1 id="et"></h1><p id="es"></p><p id="est"></p><button type="button" id="again" data-i18n="end.again"></button></div>
<script type="module" src="/src/main.ts"></script>
</body></html>
