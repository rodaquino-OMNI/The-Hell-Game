# THE HELL — balanceamento e parâmetros de sistema (GDD v0.3)
# Fonte única de números da simulação, IA, mapas, render, áudio, UI e rede (GDD-v0.2 §0 decisão 5; §15.2).
# Blocos 1–9: baseline do protótipo (GDD-v0.2 §2.3 e Apêndice A), sem alteração de valor.
# Blocos 10+: parâmetros que o GDD v0.3 converteu de [Proposta]/vago para [Especificado] (GDD-v0.3 §8–§13).
# Regra: código lê daqui; nenhum número de jogo no código. Schema e validação entram na fase 0 (item G-01).
# Unidades: metros, segundos, m/s, Hz. Multiplicadores sem unidade.

version: 0.3.1   # revisão 2: decisões D-01 a D-12 (08/11/2026)
difficulty: normal
# Conjunto de regras: "prototype" reproduz prototype/the-hell.html (paridade da fase 0, docs/prototipo-paridade.md);
# "v1" liga as regras do GDD v0.3 (cone de visão, ruído de 18 m, D-01, D-03) a partir da fase 1.
ruleset: prototype

# ---------- 1. Sobrevivente (GDD-v0.2 §2.3) ----------
survivor:
  hp: 100
  walk: 4.0
  run: 5.4
  stamina: {max: 100, drain: 15, regen: 14, regen_puzzle: 10}
  bot: {walk: 3.8, flee: 4.2, puzzle_time: 10}   # GDD-v0.2 §2.3: bot conserta em 10 s por quebra-cabeça (Mecânico: 6 s)
  radius: 0.45           # jogador; bots usam 0.5 (protótipo L129, L139 — docs/prototipo-paridade.md P-05)
  bot_radius: 0.5
  height: 1.75
  # GDD-v0.3 §8.3 ("ferido = 1 se a vida estiver abaixo de 40") e GDD-v0.2 §3.2 ([Proposta] estado Ferido, menos de 40 de vida).
  # Fonte única do limiar: clipe `ferido` (Art Bible §7), retrato "ferido" do HUD (GDD-v0.3 §12.1); a IA (R3) e as
  # pegadas luminosas (Art Bible §4) leem o mesmo campo.
  wounded_hp: 40

# ---------- 2. Caçador (GDD-v0.2 §2.3, Apêndice A) ----------
hunter:
  hp_base: 80                      # Normal, 3 sobreviventes; escala em hunter_hp_scale (GDD-v0.3 C-03)
  chase_speed: 4.3                 # D-03 b (protótipo: 3.9, ver prototype_extras)
  patrol_speed: 3.1
  final_pressure_speed_mult: 1.2
  melee: {range: 1.8, cooldown: 1.7, damage: 15, damage_final: 18, recoil: 0.6}
  detect_radius: 11
  vision_fov_deg: 90               # GDD-v0.2 §3.4/§8.1 (o protótipo usa 360°, ver C-06)
  reveal: {interval: 28, targets: 2, duration: 3.5}
  puzzle_fail_alert: 8
  dash: {speed: 11, duration: 0.35, cooldown: 15, min: 5, max: 11}
  projectile: {speed: 14, damage: 8, cooldown: 10, min: 5, max: 16}
  trap: {interval: 32, radius: 0.9, slow: 0.6, slow_time: 3}
  telegraph_min: 0.4               # GDD-v0.2 §4.1
  anti_tunnel: 15                  # GDD-v0.2 §4.3
  radius: 0.5
  height: 2.5

# Vida do caçador = hp_base[dificuldade] × fator[n sobreviventes] (GDD-v0.3 C-03)
# Fatores derivados de GDD-v0.2 §3.5 (50/65/80/90–100 com base 80).
hunter_hp_scale: {1: 0.625, 2: 0.8125, 3: 1.0, 4: 1.125, 5: 1.25}

# ---------- 3. Prisão ----------
cage: {time: 75, rescue_time: 3, rescue_range: 2.4, rescue_hp: 60, immunity: 4, deaths_at_capture: 2}

# ---------- 4. Geradores e portão (GDD-v0.2 §2.3, §3.5, §6) ----------
generator:
  puzzles_per_generator: 5
  gate_time: 45
  fails_to_regress: 3
  regress_amount: 1                # GDD-v0.2 §6.2: "3 falhas seguidas no mesmo gerador: regride 1 quebra-cabeça"
  fail_spark_time: 3
  completed_reveal: 3
  # GDD-v0.2 §3.4 ("revela o gerador por 3 s" na linha do ruído de 25 m) × §6.2 ("revela a posição por 3 s", sem raio).
  # D-21 (Rodrigo, 09/11/2026): o caçador vê o alerta de conserto de qualquer ponto do mapa (true). false = só o
  # caçador dentro de noise.generator_done reage (leitura anterior, conservadora).
  completed_reveal_global: true
  by_team_size:                    # GDD-v0.2 §3.5
    1: {required: 2, bonus: 1}
    2: {required: 3, bonus: 2}
    3: {required: 4, bonus: 3}
    4: {required: 5, bonus: 3}
    5: {required: 5, bonus: 3}
  puzzle_time_target: {full: [12, 18], solo: [8, 12]}

puzzles:
  timing: {speed: 0.9, zone: 0.25}
  sequence: {length: 4}
  accessible: {zone_mult: 1.6, timed: false}

# ---------- 5. Ruído (GDD-v0.2 §3.4; usado com ruleset v1: o caçador no raio investiga por ai.hearing_investigate_time) ----------
noise:
  walk: 0
  run: 10
  puzzle_fail: 18
  rescue: 6
  heal: 6
  generator_done: 25

# ---------- 6. Pontos (GDD-v0.2 §2.3, §7.1) ----------
# D-30 (a), 09/11/2026 (supervisão por delegação do Rodrigo): os 7 eventos [Proposta] do sobrevivente ficam ligados com
# os valores do §7.1. D-31 (a): os 6 eventos do caçador ficam desligados até o caçador humano da fase 3 (D-09).
# Cada evento credita quem fez, numa das 4 categorias do §7.1 (Objetivos, Altruísmo, Sobrevivência, Audácia).
# O valor é multiplicado por `difficulty_table.<dif>.points_mult` (§7.3; 1 no protótipo) e arredondado.
# LACUNA §7.1 × §7.3: o GDD não diz como arredondar (25 × 1,3 = 32,5). Padrão: `round` (meio para cima); `floor` trunca.
# O arredondamento é POR EVENTO, não pelo total: um gerador bônus no Difícil dá 5 × 33 + 98 = 263 (pelo total seriam
# 200 × 1,3 = 260); o placar e o evento `points` só carregam inteiros.
# LACUNA §7.1: o GDD lista as categorias, mas não liga cada evento a uma; o mapeamento abaixo segue os emblemas de
# DBD citados no §7.1 (conserto = Objetivos; resgate e cura = Altruísmo; escapar = Sobrevivência; perseguição,
# bloqueio, atordoar e sabotagem = Audácia).
# LACUNA §7.1 (créditos combinados, escolha conservadora): o parafuso conta só como "bloqueio ou parafuso útil" (+25),
# não também como "atrasar o caçador" (+40), para não pagar duas vezes a mesma ação; "atrasar" fica sem gatilho próprio.
# O Turbo do Mecânico (v1) conta como `puzzle` (avança um quebra-cabeça) e, se concluir o gerador, `generator`
# (o protótipo não pontua o Turbo; paridade). Do lado do caçador, a captura que mata credita captura + abate e o golpe
# que captura credita golpe + captura.
points:
  rounding: round
  events:
    puzzle:          {value: 10,  category: objectives, enabled: true}   # §7.1 [Implementado]
    generator:       {value: 40,  category: objectives, enabled: true}   # §7.1 [Implementado] (P-12: 5 × 10 + 40 = 90)
    bonus_puzzle:    {value: 25,  category: objectives, enabled: true}   # §7.1, §6.3 [Implementado]
    bonus_generator: {value: 75,  category: objectives, enabled: true}   # §7.1, §6.3 [Implementado]
    rescue:          {value: 60,  category: altruism,   enabled: true}   # §7.1 [Proposta] D-30: resgatar aliado
    heal:            {value: 30,  category: altruism,   enabled: true, min_effective: 20}  # §7.1 [Proposta] D-30: por aliado, vida efetivamente curada ≥ 20
    block_bolt:      {value: 25,  category: boldness,   enabled: true}   # §7.1 [Proposta] D-30: bloqueio que anula golpe ou parafuso que acerta
    stun:            {value: 40,  category: boldness,   enabled: true}   # §7.1 [Proposta] D-30: golpe do Atacador que atordoa
    chase_escape:    {value: 30,  category: boldness,   enabled: true, min_time: 15}  # §7.1 [Proposta] D-30: perseguição > 15 s sem ser capturado. LACUNA: perseguição > 15 s ainda em curso no fim da partida (limite de tempo ou caçador a 0) também credita quem segue livre
    trap_disarm:     {value: 15,  category: boldness,   enabled: true}   # §7.1 [Proposta] D-30: desativar armadilha
    escape:          {value: 100, category: survival,   enabled: true}   # §7.1 [Proposta] D-30: escapar
  # Pontos do caçador (§7.1, linha sob a tabela; sem marca de status): desligados por D-31 (a) até a fase 3 (D-09).
  # LACUNA §7.1: o GDD não dá categorias ao caçador; o placar dele é um total.
  hunter_events:
    capture:     {value: 50,  enabled: false}                # captura (sobrevivente vai à gaiola)
    hit:         {value: 15,  enabled: false}                # golpe corpo a corpo que causa dano
    kill:        {value: 100, enabled: false}                # abate (sobrevivente morre)
    long_chase:  {value: 30,  enabled: false, min_time: 15}  # perseguição longa: captura ao fim de perseguição > 15 s
    reveal:      {value: 20,  enabled: false}                # revelação eficaz: acerto em sobrevivente revelado (1 por revelação)
    deny_rescue: {value: 40,  enabled: false}                # evitar resgate: acerto em quem está resgatando

# ---------- 7. Economia (D-04 b: 1 moeda por ponto, skins 8× mais caras que no protótipo) ----------
# moedas = base_coins + win_coins × vitória + pontos × points_to_coins (GDD-v0.2 §7.2; GDD-v0.3 D-04); pontos já com points_mult.
# win_coins_to (v1): quem recebe o bônus de vitória quando a equipe vence. `alive` = todos os vivos do time vencedor
# (comportamento do R1); `escaped` = só quem escapou. `alive`: decisão do Rodrigo 09/11/2026 (pergunta 1 da sessão
# Visual), diverge da leitura literal do GDD v0.3 §3.3 item 1.
economy: {start_coins: 150, base_coins: 20, win_coins: 30, points_to_coins: 1.0, win_coins_to: alive}
skins:   # preço em moedas; protótipo: 0 / 100 / 80 / 120 / 150 / 200 / 250
  std: 0
  abo: 800
  som: 640
  neo: 960
  car: 1200
  our: 1600
  fan: 2000

# ---------- 8. Classes (GDD-v0.2 §2.3, Apêndice A) ----------
classes:
  healer: {pulse_heal: 45, pulse_radius: 6, cooldown: 10}
  mechanic:
    turbo: {cooldown: 14, range: 3}
    bolt: {damage: 6, slow: 0.5, slow_time: 3, cooldown: 6, range: 8}
    puzzle_zone: 0.4
    bot_puzzle_time: 6
  fighter:
    strike: {damage: 12, stun: 3, cooldown: 5, range: 3.2}
    block: {time: 5, cooldown: 8}
  repeat_penalty: {cooldown_base: 1.5, effect_step: 0.3}   # GDD-v0.2 §5.1
  upgrade_caps: {min_cooldown_mult: 0.5, max_effect_mult: 1.5}

# ---------- 9. Dificuldade (GDD-v0.2 §7.3; perseguição escalada ×4,3/3,9 pela D-03 b) ----------
difficulty_table:
  easy:      {hunter_hp: 60,  chase: 3.9, melee_cd: 2.2, detect: 9,  reveal: 35, cage: 90, gate: 35, zone_mult: 1.3,  projectile_dmg: 6,  trap_interval: 40, points_mult: 0.8}
  normal:    {hunter_hp: 80,  chase: 4.3, melee_cd: 1.7, detect: 11, reveal: 28, cage: 75, gate: 45, zone_mult: 1.0,  projectile_dmg: 8,  trap_interval: 32, points_mult: 1.0}
  hard:      {hunter_hp: 100, chase: 4.6, melee_cd: 1.4, detect: 13, reveal: 22, cage: 60, gate: 55, zone_mult: 0.8,  projectile_dmg: 10, trap_interval: 26, points_mult: 1.3}
  nightmare: {hunter_hp: 120, chase: 5.0, melee_cd: 1.2, detect: 15, reveal: 18, cage: 45, gate: 60, zone_mult: 0.65, projectile_dmg: 12, trap_interval: 20, points_mult: 1.6}

# ---------- 9b. Comportamentos do protótipo fora do GDD (docs/prototipo-paridade.md §2) ----------
prototype_extras:
  interact_range: {generator: 2.6, trap: 2.0}          # P-01
  camera: {fov: 72, shoulder: 0.8, distance: 3.6, height: 2.3, wall_step: 0.3}   # P-02
  heartbeat: {radius: 20, base_interval: 0.35, range_interval: 1.1}             # P-03
  vignette_radius: 16                                   # P-04
  mechanic_bot_trap_immune: true                        # P-06
  bolt_aim_cos: 0.6                                     # P-07 (cone de ±53° para o jogador)
  fighter_strike_cd_on_miss: true                       # P-08
  projectile_life: 2.0
  gate_exit_half_width: 3.2
  chase_speed: 3.9                                      # paridade da fase 0 (D-03 b muda o jogo para 4.3)
  # números internos do protótipo, sem equivalente no GDD (docs/prototipo-paridade.md; L = linha do protótipo)
  hunter_initial: {dash: 6, projectile: 6, trap: 14, reveal: 20}   # L106-107: recargas no início da partida
  patrol: {range: 50, reach: 2}                         # L163: ponto de patrulha sorteado em ±25 m
  projectile_hit_radius: 0.8                            # L146
  sidestep: {time: 0.7, angle: 1.2, min_progress: 0.4}  # L129: desvio ao travar em parede
  cage_slot_spacing: 0.7                                # L125
  rescued_offset: 2.5                                   # L127
  stamina_min_to_run: 5                                 # L138
  bot:                                                  # L172-181
    heal_threshold: 65
    mechanic_bolt_dist: 8
    fighter_block_dist: 4
    fighter_engage_dist: 7
    fighter_chase_stunned_dist: 8
    fighter_strike_dist: 2.6
    flee_dist: 9
    rescue_min_hunter_dist: 16
    reach: 1.9
    gate_speed: 4
    wait_point: [0, -24]
    wait_reach: 3

# ---------- 10. Partida (GDD-v0.3 §3.3 revisto) ----------
match:
  prep_time: [10, 20]
  hunter_spawn_min_dist: 35
  hard_time_limit: 600              # D-02 a
  team_min_escapes: 1               # D-01 b: basta 1 escapar

# ---------- 11. IA (GDD-v0.3 §8) ----------
ai:
  # Caçador do ruleset v1 (item R3). "basic" = caçador mínimo do R1 (age a 60 Hz, sem tempo de reação; é o que a
  # suíte rules-v1 fixa); "utility" = IA do GDD-v0.3 §8 (percepção e decisão a 10 Hz, estados do §8.2, utilidade do
  # §8.3, dificuldade do §8.4, navegação do §8.6). Como `ruleset`, o padrão muda no marco MJ-B.
  hunter_brain: basic
  decision_hz: 10
  perception_hz: 10
  hearing_investigate_time: 8
  target_weights: {proximity: 0.35, generator_progress: 0.25, injured: 0.20, isolated: 0.15, protected: -0.25}
  target_switch_margin: 0.15
  isolated_radius: 8
  protected_radius: 4
  # Números técnicos da IA sem valor no GDD (LACUNA registrada no relatório do R3; valores conservadores):
  patrol_reach: 2                   # §8.2: chegou ao gerador/portão da patrulha (mesmo valor do protótipo, prototype_extras.patrol.reach)
  search_radius: 6                  # §8.1: ao chegar ao ponto investigado, vasculha pontos sorteados até esta distância
  loop_band: 1.6                    # §8.4: alvo "no loop" se estiver a até isto da rota do loop (= maps.corridor_min, largura mínima da rota)
  static_target_speed: 0.5          # §8.4 "alvo parado": velocidade percebida abaixo disto
  by_difficulty:
    easy:      {reaction: 0.6,  projectile_lead: none,          loop_knowledge: none,    memory: 4}
    normal:    {reaction: 0.4,  projectile_lead: none,          loop_knowledge: partial, memory: 8}
    hard:      {reaction: 0.25, projectile_lead: linear,        loop_knowledge: full,    memory: 12}
    nightmare: {reaction: 0.15, projectile_lead: linear_static, loop_knowledge: avoid_long, memory: 15}
  loop_partial_laps_before_break: 2
  anti_stuck: {min_progress_ratio: 0.4, window: 0.7}
  stuck_fail_after: 3               # critério T-03: deslocamento < 40% por > 3 s com caminho válido = trava
  bots:
    personalities:
      cautious:  {flee_dist: 12, bonus: avoid}
      bold:      {flee_dist: 7,  bonus: prefer}
      altruist:  {flee_dist: 9,  bonus: avoid, rescue_priority: high}
    puzzle_fail_rate: 0.15
    ping_reaction: [0.3, 0.8]

# ---------- 12. Navegação (GDD-v0.3 §8.6) ----------
nav:
  cell_size: 0.1
  cell_height: 0.1
  agent_radius: 0.5                 # maior agente (caçador)
  agent_height: 2.5
  walkable_climb: 0.3
  walkable_slope_deg: 40
  fallback_grid: 0.5                # grade A* de reserva (GDD-v0.3 §8.6)
  # Tolerância de consulta (técnica, GDD-v0.3 §8.6/§9.1): distância máxima entre um ponto pedido e o ponto
  # mais próximo do navmesh/grade para valer como "no caminho". Igual à célula da grade de reserva.
  query_snap: 0.5

# ---------- 13. Mapas (GDD-v0.3 §9) ----------
maps:
  corridor_min: 1.6                 # §9.1: navmesh com raio corridor_min/2 conecta todas as áreas jogáveis
  wall_height: 3.4
  side: [60, 80]
  loop_short_perimeter: [8, 12]
  loop_long_perimeter_min: 18
  loop_advantage: [6, 10]           # §9.1: medido no simulador (R5); o validador não mede
  loop_coverage_radius: 20
  loop_coverage_min: 0.9
  hideouts_min: 3
  generator_min_dist: 25            # §9.1: distância no navmesh entre geradores obrigatórios, em todos os layouts
  generator_layouts: [3, 4]         # §9.3: 3 a 4 layouts de geradores por mapa
  cage_positions: 2                 # §9.3
  exits: 2                          # §9.3
  layout_hunter_dist_spread_max: 0.2  # §9.3 aceite: (maior − menor) ÷ menor distância média caçador → geradores

# ---------- 14. Render (GDD-v0.3 §10) ----------
render:
  default_preset: medium            # GDD-v0.3 §10.2: Médio é o padrão
  presets:
    low:    {internal: [320, 180], layers: [A], shadows: false}
    medium: {internal: [384, 216], layers: [A, B], shadows: true}
    high:   {internal: [480, 270], layers: [A, B, C], shadows: true}
  # GDD-v0.3 §10.1: intensidades de 0 a 1 por efeito (menu de acessibilidade, V8).
  # snap = vertex snapping na grade de 1/snap_grid da largura da tela; affine = UV sem correção de perspectiva;
  # gouraud = iluminação por vértice (C-12); dither = Bayer 4×4 + quantização para color_bits por canal.
  ps1: {snap: 1.0, snap_grid: 128, affine: 1.0, gouraud: 1.0, dither: 1.0, color_bits: 5}
  tessellate: 2                     # m; GDD-v0.3 §10.1 item 2: chão e paredes subdivididos (limita a distorção afim e dá vértices ao Gouraud)
  fog: {near: 3, far: 30}
  camera: {near: 0.1, far: 60, eye_height: 1.5}   # prototype/the-hell.html L93 (near/far) e L188 (olho em 1ª pessoa)
  lights: {ambient: 0.9, player: 1.2, player_decay: 1, player_height: 2.5}   # prototype/the-hell.html L94 e L189 (paridade); × π no código (three.js atual sem unidades físicas)
  player_light_radius: 24
  anim_fps: 12
  shadow_map: 256                   # px; GDD-v0.3 §10.2 (sombra dos presets Médio e Alto), GDD-v0.2 §10.2 camada B
  # GDD-v0.3 §10.2, camada A (todos os presets; itens em GDD-v0.2 §10.2): intensidades de 0 a 1 por efeito
  # (menu de acessibilidade, V8), aplicadas no passe final antes do dither (o dither absorve o grão).
  # Cores por token de data/art/palette.json. Os demais números são a calibração para o marco A3.
  layer_a:
    grain: 1.0                      # "grão de filme"
    grain_amount: 0.035             # amplitude máxima (cor linear 0..1) com grain = 1
    grain_fps: 12                   # Hz; troca do padrão no relógio da simulação (= render.anim_fps, passo PS1)
    vignette: 1.0
    vignette_radius: [0.5, 1.1]     # distância ao centro (canto = 1) onde a vinheta começa e onde chega ao máximo
    vignette_amount: 0.6            # escurecimento máximo com vignette = 1
    scanlines: 1.0                  # "scanlines leves"
    scanline_amount: 0.1            # linha escura 10% mais escura com scanlines = 1
    aberration: 1.0                 # "aberração cromática ao receber dano"
    aberration_px: 2                # deslocamento máximo de R e B (pixels internos) no canto da tela
    aberration_time: 0.4            # s; o pulso decai até 0 depois do dano (relógio da simulação)
    bloom: 1.0                      # "bloom leve nos emissivos (feixes, lâmpadas)": só materiais emissivos
    bloom_radius_px: 3              # raio do brilho em pixels internos
    bloom_amount: 0.6
    lut: 1.0                        # "LUT de cor fria"
    lut_size: 16                    # LUT 3D de 16³
    lut_tint: world.fog             # token: tom puxado nas sombras
    lut_tint_amount: 0.045          # deslocamento máximo (cor linear) do canal dominante do croma do token, no preto
    lut_shadow_pivot: 0.35          # luminância até onde vale o tom das sombras
    lut_gain: [0.93, 0.98, 1.06]    # ganho R, G, B (esfria os tons médios e altos)
    lut_saturation: 0.85            # 1 = igual; cor saturada continua informação (Art Bible §1)
  # GDD-v0.3 §10.2 e §12.4: "a aberração cromática e o grão respeitam a opção reduzir flicker".
  # Multiplicadores com a opção ligada; o grão também deixa de animar (padrão fixo).
  reduce_flicker: {grain: 0.35, aberration: 0}
  # GDD-v0.3 §10.2, camada B (Médio e Alto): lanterna com cone e sombra de shadow_map px; luz assada nos vértices.
  layer_b:
    # intensidade × π no código (como render.lights); angle_deg = meia abertura do cone; height, forward e side (m):
    # posição na mão, à frente e à direita do jogador (luz fora do olho, para a sombra aparecer)
    lantern: {color: light.jogador, intensity: 7, distance: 18, decay: 1, angle_deg: 28, penumbra: 0.35, height: 1.5, forward: 0.35, side: 0.3, shadow_bias: -0.002}
    caster_radius: 1.3              # m; esfera que envolve um personagem no recorte da sombra (caçador de 2,5 m, Art Bible §3)
    # luz assada: oclusão perto dos muros (chão e base das paredes) e poça de luz das lâmpadas dos geradores
    bake: {ao_min: 0.45, ao_radius: 2.5, light_color: light.ambiente, light_intensity: 1.2, light_radius: 6, light_height: 1.2}
  # GDD-v0.3 §10.2, camada C (só Alto). O v0.3 não detalha a camada; itens do GDD-v0.2 §10.2. Implementados:
  # névoa volumétrica barata (billboards) e partículas de poeira. Decals e poças: LACUNA (sem posições no mapa).
  layer_c:
    fog_billboards: {color: world.fog, count: 60, size: [6, 12], height: [0.6, 2.4], opacity: 0.2, drift: 0.6, drift_speed: 0.15, near_fade: 4}
    dust: {count: 320, box: 12, size_px: 1, opacity: 0.6, ambient: 0.25, color: world.gaiola, fall: 0.06, sway: 0.25}   # ambient: visibilidade fora do cone da lanterna
  budgets: {fps: 60, draw_calls: 150, triangles: 60000, initial_download_mb: 15, map_download_mb: 40, time_to_play_s: 5}
  # custo das camadas (plano-fases-1-2 §5 V4 e V7; revisão do V4): tempo de render do preset médio com A+B dividido
  # pelo mesmo preset sem camadas, medido de forma síncrona no SwiftShader a 1280×720 (tools/visual/compare.mjs,
  # tempo de CPU do processo de GPU, mediana de 11 pares). Medido em 08/11/2026 com a máquina carregada: 1,25 a 1,38×
  # (antes das otimizações: 1,87×). Teto com folga para o ruído; a meta da revisão é 1,3×
  layer_cost_factor: 1.4
  # legibilidade depois da camada A (Art Bible §5.3; revisão do V4), medida em tools/visual/compare.mjs: olhos do
  # caçador no preparo e feixes ≥ min_contrast contra o fundo (WCAG 2.2 1.4.11, 3:1, o mesmo da paleta); o corpo do
  # caçador fora do cone conserva body_keep do contraste que tem sem a camada A
  legibility: {min_contrast: 3, body_keep: 0.9}
  models: {survivor_tris: [300, 600], hunter_tris: [800, 1200], atlas: 64}
  # V3 (F2-03): leitura de estado no jogo (Art Bible §4). Frequências da tabela da §4; o resto é medida de arte.
  states:
    # feixe do gerador: largura e altura (m); min_px = largura mínima na resolução interna (o feixe distante não vira
    # tracejado, achado da revisão do V1); snap = intensidade do vertex snapping só no feixe (0: a linha não quebra de longe)
    beam: {width: 0.25, height: 14, min_px: 1.5, snap: 0}
    lamp: {size: [0.4, 0.3, 0.4], height: 1.2}       # lâmpada no topo do gerador (mesmo padrão do feixe)
    pending_hz: 1                                    # pendente: pisca devagar, 1 vez por segundo
    pending_duty: 0.5                                # fração do ciclo do pendente com o feixe aceso
    progress_hz: 2                                   # em progresso: pulsa 2 vezes por segundo
    progress_pulse: 0.8                              # no pico do pulso a largura do feixe é × (1 + progress_pulse)
    # bônus: espiral de spiral_steps blocos (lado spiral_block) em spiral_turns voltas de raio spiral_radius, girando a
    # spiral_hz voltas por segundo, e losango (octaedro de raio diamond) no topo do feixe
    bonus: {spiral_hz: 0.5, spiral_turns: 3, spiral_steps: 18, spiral_radius: 0.5, spiral_block: 0.18, diamond: 0.45}
    # lampejo horizontal nos olhos do caçador durante o preparo: largura, altura e avanço para a câmera (m; o braço
    # erguido no golpe não o tapa) e altura mínima em pixels da resolução interna (de longe a faixa fina não some;
    # o lampejo, como o feixe, não usa vertex snapping)
    eyes_flare: [0.7, 0.07, 0.35, 2]
    lock: {size: 0.5, above: 0.5}                    # cadeado sobre o aliado preso: lado (m) e altura acima da cabeça (m)
  # D-13, D-14, D-15 (docs/plano-construcao.md §7; item V9 em docs/handoff/plano-fases-1-2.md §5): MOCKUP do modo
  # "Retro FPS" para o mini marco de arte A2b. Só liga com o parâmetro de depuração ?retro=1 (sem opção de menu; a 3ª
  # pessoa continua padrão). Medidas de arte a calibrar depois da aprovação do filho (D-14), não regra de jogo.
  retro:
    # balanço da ferramenta ao andar (D-13: "balanço com intensidade 0–1"; o V8 "reduzir balanço de câmera",
    # GDD-v0.3 §12.4, vai multiplicar `bob`). Amplitude (m: lado, vertical) com bob = 1 na velocidade de corrida
    # (survivor.run); um ciclo a cada `bob_stride` m andados; `bob_return` = fração por quadro de volta ao repouso
    bob: 0.5
    bob_amplitude: [0.03, 0.022]
    bob_stride: 1.6
    bob_return: 0.15
    # ferramenta da classe na mão (D-13): peças da ficha (data/art/personagens.json) presas ao osso `osso` (filtradas
    # por `cores` quando há), com o ponto `origem` (m, coordenadas da ficha) posto em `pos` no espaço da câmera
    # (m; +X direita, +Y cima, −Z frente), giro `rot` (graus, XYZ) e `escala`. Mãos: caixa de pele `hand.size` e
    # antebraço na cor dos braços da ficha, do centro da mão até `pos + antebraco`
    viewmodel:
      fov: 60                       # graus; câmera só da ferramenta (independe do slider de fov do V8)
      far: 10                       # m; plano distante da câmera da ferramenta (a ferramenta está a menos de 1 m)
      light: {ambient: light.ambiente, ambient_intensity: 1.4, key: light.jogador, key_intensity: 1.1, key_pos: [0.6, 0.5, 0.3]}
      hand: {size: [0.075, 0.07, 0.11], forearm: [0.05, 0.045], forearm_sides: 6}   # forearm: raio no punho e no fim; lados do prisma
      classes:
        curandeiro:
          grupos: [{osso: hand_r, origem: [0, 0, 0], pos: [0.28, -0.24, -0.62], rot: [-48, -54, 60], escala: 0.32}]
          maos: [{pos: [0.3, -0.25, -0.62], rot: [-18, 8, 8], antebraco: [0.22, -0.3, 0.45]}]
        mecanico:
          grupos:
            - {osso: hand_r, origem: [-0.12, 0, 0.02], pos: [0.3, -0.24, -0.6], rot: [-12, 60, -80], escala: 0.48}
            - {osso: Head, cores: [char.lanterna], origem: [0, 0.2, 0.17], pos: [-0.28, -0.2, -0.6], rot: [6, -10, 0], escala: 1.4}
          maos:
            - {pos: [0.3, -0.25, -0.57], rot: [-12, 0, 10], antebraco: [0.2, -0.3, 0.45]}
            - {pos: [-0.3, -0.25, -0.57], rot: [-8, 0, -6], antebraco: [-0.2, -0.3, 0.45]}
        atacador:
          grupos: [{osso: spine_03, origem: [-0.2, 0.37, -0.19], pos: [0.32, -0.25, -0.6], rot: [-28, 0, 150], escala: 0.72}]
          maos: [{pos: [0.32, -0.25, -0.6], rot: [-14, 0, 14], antebraco: [0.22, -0.3, 0.45]}]
        protetor:
          grupos: [{osso: lowerarm_l, origem: [0.14, 0.09, 0.026], pos: [-0.36, -0.2, -0.66], rot: [-40, 0, -50], escala: 0.55}]
          maos: [{pos: [-0.24, -0.29, -0.58], rot: [-8, 0, -6], antebraco: [-0.2, -0.3, 0.45]}]
        batedor:
          # LACUNA: a Art Bible §3 e a ficha não dão ferramenta de mão ao Batedor (o acessório é o cachecol); o mockup
          # mostra as mãos livres e a ponta do cachecol entrando pela esquerda (pergunta ao filho no A2b)
          grupos: [{osso: spine_03, cores: [char.cachecol], origem: [0.12, -0.06, -0.3], pos: [-0.42, -0.2, -0.55], rot: [20, 30, -60], escala: 0.55}]
          maos:
            - {pos: [0.26, -0.22, -0.58], rot: [-20, 0, 12], antebraco: [0.2, -0.3, 0.45]}
            - {pos: [-0.22, -0.23, -0.6], rot: [-20, 0, -12], antebraco: [-0.2, -0.3, 0.45]}
    # D-15: variante industrial do Pátio (texturas e iluminação, sem layout novo; catálogo de mapas da v1.0 inalterado,
    # D-06). Texturas procedurais de `texture` px com o PRNG com semente do cliente (render/options.ts); cores só por
    # token world.industrial.* de data/art/palette.json (secundárias, sem mudar tokens aprovados)
    industrial:
      texture: 64
      # parede: chapas rebitadas (plates × plates por ladrilho) com borda iluminada de opacidade `edge_alpha`, rebites
      # de `rivet` px (largura, altura; sombra da mesma altura embaixo) a cada `rivet_step` px a `rivet_inset` px da
      # borda, faixa de segurança diagonal de `stripe` px de altura na base (listras de `stripe_period` px) e `grime`
      # salpicos de sujeira com opacidade na faixa `grime_alpha` e escorrido de `grime_drip` px (faixa [mín, máx))
      wall: {base: world.industrial.parede, edge: world.industrial.chapa, seam: world.industrial.junta, stripe_color: world.industrial.faixa, plates: 2, edge_alpha: 0.5, rivet: [2, 1], rivet_step: 8, rivet_inset: 3, stripe: 10, stripe_period: 8, grime: 90, grime_alpha: [0.25, 0.6], grime_drip: [1, 4]}
      # chão: lajes de concreto com junta na borda do ladrilho; `stains` manchas escuras de `stain_size` px com
      # opacidade em `stain_alpha` e `flecks` salpicos claros de 1 px com opacidade em `fleck_alpha`
      floor: {base: world.industrial.chao, seam: world.industrial.junta, fleck: world.industrial.chapa, flecks: 220, fleck_alpha: [0.2, 0.6], stains: 160, stain_alpha: [0, 0.35], stain_size: 2}
      # luz: ambiente fria no lugar de light.ambiente; luz assada âmbar (camada B) nas lâmpadas dos geradores e em
      # luminárias no topo dos muros, uma a cada `lamp_spacing` m de muro (muros menores que isso ganham uma no centro),
      # a `lamp_offset` m da face; luminária emissiva de `lamp_size` m (uma InstancedMesh: 1 chamada de desenho)
      ambient: world.industrial.luz_fria
      ambient_intensity: 1.5
      bake_color: world.industrial.faixa
      bake_intensity: 3.5
      lamp_token: world.industrial.tubo
      lamp_spacing: 14
      lamp_offset: 0.5
      lamp_size: [1.2, 0.12, 0.25]

# ---------- 15. Áudio (GDD-v0.3 §11) ----------
audio:
  music:
    # A-2 (music.ts / musicState.ts). Um stem por estado musical; o nome é também o arquivo
    # `audio/music/<stem>.mp3` (contrato com o A-3). GDD-v0.3 §11: 5 stems (ambiente, tensão, perseguição,
    # pressão final, resgate).
    stems: [ambient, tension, chase, final_pressure, rescue]
    tension_radius: 25                # GDD-v0.3 §11 e GDD-v0.2 §11: tensão com o caçador a < 25 m
    crossfade_bars: 1                 # GDD-v0.3 §11: crossfade de 1 compasso
    # Andamento, compasso e tom: decisão do Rodrigo, 09/11/2026 (sessão Áudio): 90 BPM, 4/4, Ré menor, síntese PS1
    # pura. Compasso = beats_per_bar × 60 / bpm = 2,667 s; a troca de stem cai no início do compasso seguinte
    # (GDD-v0.3 §11). `key` é lido pela composição procedural (A-3).
    bpm: 90
    beats_per_bar: 4
    key: "D minor"
    # LACUNA (GDD não define): ganho linear do stem ativo (os inativos ficam em 0). Proposta: 1, porque os stems já
    # saem masterizados a −16 LUFS (GDD-v0.3 §11, medido no A-7); o volume do jogador fica no barramento `music`.
    layer_gain: 1
    # LACUNA (GDD não define): constantes de tempo (s) do ducking (GDD-v0.3 §11: −8 dB em eventos críticos).
    # Proposta: ataque 0,05 s (a música abaixa em ~150 ms, junto com o evento) e soltura 0,5 s (volta em ~1,5 s,
    # sem "bombear").
    duck_attack: 0.05
    duck_release: 0.5
    # LACUNA (GDD não define): antecedência (s) entre decodificar os stems e iniciá-los juntos, para que os 5
    # `start(t)` caiam no mesmo instante futuro do relógio de áudio. Proposta: 0,1 s (> 2 quadros a 30 fps).
    start_lead: 0.1
  max_voices: 32
  occlusion_lowpass_hz: 800
  loudness_lufs: -16
  loudness_tolerance: 1
  true_peak_dbtp: -1
  ducking_db: -8
  # A-1 (engine.ts): volume padrão de cada barramento, ganho LINEAR 0–1 aplicado direto no GainNode (0 = mudo,
  # 1 = sem atenuação). Linear e não dB porque é o valor que o slider mostra e o GainNode recebe, e 0 representa o
  # mudo sem precisar de −∞ dB. Barramentos = os sliders separados de música, efeitos, voz e UI (GDD-v0.3 §11,
  # Mixagem; GDD-v0.2 §11) somados no master.
  # Volume inicial dos sliders (GDD v0.2/v0.3 não definem): D-28 (docs/plano-construcao.md §7), 1 em todos, para a
  # música chegar ao jogador no nível em que foi masterizada (−16 LUFS, GDD-v0.3 §11) e os bipes da fase 0
  # manterem o volume atual.
  buses: {master: 1, music: 1, sfx: 1, voice: 1, ui: 1}
  # D-29 (docs/plano-construcao.md §7; GDD não define): constante de tempo (s) da rampa setTargetAtTime ao mudar um volume. Proposta: 0,02 s
  # (chega a ~95% em 3 constantes = 60 ms), curta o bastante para o slider responder na hora e longa o bastante para
  # não estalar ("zipper noise") com o ganho mudando em degrau.
  volume_ramp_tc: 0.02
  # D-29 (docs/plano-construcao.md §7; GDD não define): atraso (s) para gravar os volumes no localStorage depois da última mudança (o slider
  # arrastado não grava a cada quadro; o ganho muda na hora). Proposta: 0,25 s; também grava ao sair da página
  # (pagehide).
  volume_persist_delay: 0.25

# ---------- 16. UI (GDD-v0.3 §12) ----------
ui:
  threat_radius: 15                 # GDD-v0.3 §12.1: seta de ameaça a < 15 m (ou caçador revelado)
  threat_sectors: 8                 # GDD-v0.3 §12.1: só a direção, quantizada em 8 setores
  ping_types: [generator_here, hunter_here, need_help, going_to_rescue]   # GDD-v0.2 §12.1 (4 tipos)
  ping_cooldown: 2                  # GDD-v0.3 §12.1
  # LACUNA (GDD v0.2/v0.3 não definem): tempo que um ping fica visível. Proposta de 4 s, igual à marcação do
  # ping do Batedor (GDD-v0.2 §5.2); decisão do Rodrigo pendente.
  ping_lifetime: 4
  # Retrato "ferido" no HUD: lê survivor.wounded_hp (fonte única do limiar de ferido, GDD-v0.3 §8.3).
  fov: {min: 60, max: 100, default: 75}
  tutorial_time: 60
  ftue_target_min: 10
  min_contrast: 4.5
  locales: [pt-BR, en, es]

# ---------- Laço do cliente (GDD-v0.3 §13.3: passo fixo de 1/60 s) ----------
# O laço acumula o tempo real do quadro e roda quantos passos de 1/60 s couberem, para a partida andar em
# tempo real mesmo com quadro lento (o limite de 600 s do §3.3 revisto e a simulação do servidor, C-11, correm em
# tempo real). O protótipo limitava o quadro a 0,05 s (prototype/the-hell.html L202), o que põe a partida em câmera
# lenta abaixo de 20 fps (docs/prototipo-paridade.md P-13). Tetos contra a "espiral da morte" (quadro longo, como
# ao voltar de uma aba em segundo plano): o tempo de um quadro vale no máximo max_frame_dt e cada quadro roda no
# máximo max_steps_per_frame passos; o que passar disso é descartado.
client:
  max_frame_dt: 0.25                # s (4 fps); padrão de "Fix Your Timestep!" (Glenn Fiedler, gafferongames.com)
  max_steps_per_frame: 15           # = 0,25 s × 60 Hz

# ---------- 17. Rede (GDD-v0.3 §13.4) ----------
net:
  sim_step_hz: 60
  server_tick_hz: 30
  snapshot_hz: 20
  input_hz: 60
  interp_buffer_ms: 100
  lag_comp_max_ms: 150
  pos_quant: 64                     # 1/64 m
  angle_bits: 8
  budget_kbps_per_client: 20
  playable_ping_ms: 150
  warn_ping_ms: 200
  reconnect_s: 30
  max_clients_per_room: 6
