# THE HELL — balanceamento e parâmetros de sistema (GDD v0.3)
# Fonte única de números da simulação, IA, mapas, render, áudio, UI e rede (GDD-v0.2 §0 decisão 5; §15.2).
# Blocos 1–9: baseline do protótipo (GDD-v0.2 §2.3 e Apêndice A), sem alteração de valor.
# Blocos 10+: parâmetros que o GDD v0.3 converteu de [Proposta]/vago para [Especificado] (GDD-v0.3 §8–§13).
# Regra: código lê daqui; nenhum número de jogo no código. Schema e validação entram na fase 0 (item G-01).
# Unidades: metros, segundos, m/s, Hz. Multiplicadores sem unidade.

version: 0.3.1   # revisão 2: decisões D-01 a D-12 (08/11/2026)
difficulty: normal
# Conjunto de regras: "prototype" reproduz prototype/the-hell.html (paridade da fase 0, docs/prototipo-paridade.md);
# "v1" liga as regras do GDD v0.3 (cone de visão, ruído de 18 m, D-01, D-03) a partir da fase 1.
# Padrão "v1" desde o marco MJ-B (docs/handoff/plano-frente-r.md, MJ-B). A paridade com o protótipo continua
# coberta por packages/sim/test/parity.test.ts, que fixa `ruleset: prototype` explicitamente.
ruleset: v1

# ---------- 1. Sobrevivente (GDD-v0.2 §2.3) ----------
survivor:
  hp: 100
  walk: 4.0
  run: 5.4
  stamina: {max: 100, drain: 15, regen: 14, regen_puzzle: 10}
  bot: {walk: 3.8, flee: 4.2, puzzle_time: 10}   # GDD-v0.2 §2.3: bot conserta em 10 s por quebra-cabeça (Mecânico: 6 s)
  radius: 0.45           # jogador; bots usam 0.5 (protótipo L129, L139 — docs/prototipo-paridade.md P-05)
  bot_radius: 0.5
  height: 1.75
  # GDD-v0.3 §8.3 ("ferido = 1 se a vida estiver abaixo de 40") e GDD-v0.2 §3.2 ([Proposta] estado Ferido, menos de 40 de vida).
  # Fonte única do limiar: clipe `ferido` (Art Bible §7), retrato "ferido" do HUD (GDD-v0.3 §12.1); a IA (R3) e as
  # pegadas luminosas (Art Bible §4) leem o mesmo campo.
  wounded_hp: 40

# ---------- 2. Caçador (GDD-v0.2 §2.3, Apêndice A) ----------
hunter:
  hp_base: 80                      # Normal, 3 sobreviventes; escala em hunter_hp_scale (GDD-v0.3 C-03)
  chase_speed: 4.3                 # D-03 b (protótipo: 3.9, ver prototype_extras)
  patrol_speed: 3.1
  final_pressure_speed_mult: 1.2
  melee: {range: 1.8, cooldown: 1.7, damage: 15, damage_final: 18, recoil: 0.6}
  detect_radius: 11
  vision_fov_deg: 90               # GDD-v0.2 §3.4/§8.1 (o protótipo usa 360°, ver C-06)
  reveal: {interval: 28, targets: 2, duration: 3.5}
  puzzle_fail_alert: 8
  dash: {speed: 11, duration: 0.35, cooldown: 15, min: 5, max: 11}
  projectile: {speed: 14, damage: 8, cooldown: 10, min: 5, max: 16}
  trap: {interval: 32, radius: 0.9, slow: 0.6, slow_time: 3}
  telegraph_min: 0.4               # GDD-v0.2 §4.1
  anti_tunnel: 15                  # GDD-v0.2 §4.3
  radius: 0.5
  height: 2.5

# Vida do caçador = hp_base[dificuldade] × fator[n sobreviventes] (GDD-v0.3 C-03)
# Fatores derivados de GDD-v0.2 §3.5 (50/65/80/90–100 com base 80).
hunter_hp_scale: {1: 0.625, 2: 0.8125, 3: 1.0, 4: 1.125, 5: 1.25}

# ---------- 3. Prisão ----------
cage: {time: 75, rescue_time: 3, rescue_range: 2.4, rescue_hp: 60, immunity: 4, deaths_at_capture: 2}

# ---------- 4. Geradores e portão (GDD-v0.2 §2.3, §3.5, §6) ----------
generator:
  puzzles_per_generator: 5
  gate_time: 45
  fails_to_regress: 3
  regress_amount: 1                # GDD-v0.2 §6.2: "3 falhas seguidas no mesmo gerador: regride 1 quebra-cabeça"
  fail_spark_time: 3
  completed_reveal: 3
  # GDD-v0.2 §3.4 ("revela o gerador por 3 s" na linha do ruído de 25 m) × §6.2 ("revela a posição por 3 s", sem raio).
  # D-21 (Rodrigo, 09/11/2026): o caçador vê o alerta de conserto de qualquer ponto do mapa (true). false = só o
  # caçador dentro de noise.generator_done reage (leitura anterior, conservadora).
  completed_reveal_global: true
  by_team_size:                    # GDD-v0.2 §3.5
    1: {required: 2, bonus: 1}
    2: {required: 3, bonus: 2}
    3: {required: 4, bonus: 3}
    4: {required: 5, bonus: 3}
    5: {required: 5, bonus: 3}
  puzzle_time_target: {full: [12, 18], solo: [8, 12]}

puzzles:
  timing: {speed: 0.9, zone: 0.25}
  sequence: {length: 4}
  accessible: {zone_mult: 1.6, timed: false}

# ---------- 5. Ruído (GDD-v0.2 §3.4; usado com ruleset v1: o caçador no raio investiga por ai.hearing_investigate_time) ----------
noise:
  walk: 0
  run: 10
  puzzle_fail: 18
  rescue: 6
  heal: 6
  generator_done: 25

# ---------- 6. Pontos (GDD-v0.2 §2.3, §7.1) ----------
# D-30 (a), 09/11/2026 (supervisão por delegação do Rodrigo): os 7 eventos [Proposta] do sobrevivente ficam ligados com
# os valores do §7.1. D-31 (a): os 6 eventos do caçador ficam desligados até o caçador humano da fase 3 (D-09).
# Cada evento credita quem fez, numa das 4 categorias do §7.1 (Objetivos, Altruísmo, Sobrevivência, Audácia).
# O valor é multiplicado por `difficulty_table.<dif>.points_mult` (§7.3; 1 no protótipo) e arredondado.
# LACUNA §7.1 × §7.3: o GDD não diz como arredondar (25 × 1,3 = 32,5). Padrão: `round` (meio para cima); `floor` trunca.
# O arredondamento é POR EVENTO, não pelo total: um gerador bônus no Difícil dá 5 × 33 + 98 = 263 (pelo total seriam
# 200 × 1,3 = 260); o placar e o evento `points` só carregam inteiros.
# LACUNA §7.1: o GDD lista as categorias, mas não liga cada evento a uma; o mapeamento abaixo segue os emblemas de
# DBD citados no §7.1 (conserto = Objetivos; resgate e cura = Altruísmo; escapar = Sobrevivência; perseguição,
# bloqueio, atordoar e sabotagem = Audácia).
# LACUNA §7.1 (créditos combinados, escolha conservadora): o parafuso conta só como "bloqueio ou parafuso útil" (+25),
# não também como "atrasar o caçador" (+40), para não pagar duas vezes a mesma ação; "atrasar" fica sem gatilho próprio.
# O Turbo do Mecânico (v1) conta como `puzzle` (avança um quebra-cabeça) e, se concluir o gerador, `generator`
# (o protótipo não pontua o Turbo; paridade). Do lado do caçador, a captura que mata credita captura + abate e o golpe
# que captura credita golpe + captura.
points:
  rounding: round
  events:
    puzzle:          {value: 10,  category: objectives, enabled: true}   # §7.1 [Implementado]
    generator:       {value: 40,  category: objectives, enabled: true}   # §7.1 [Implementado] (P-12: 5 × 10 + 40 = 90)
    bonus_puzzle:    {value: 25,  category: objectives, enabled: true}   # §7.1, §6.3 [Implementado]
    bonus_generator: {value: 75,  category: objectives, enabled: true}   # §7.1, §6.3 [Implementado]
    rescue:          {value: 60,  category: altruism,   enabled: true}   # §7.1 [Proposta] D-30: resgatar aliado
    heal:            {value: 30,  category: altruism,   enabled: true, min_effective: 20}  # §7.1 [Proposta] D-30: por aliado, vida efetivamente curada ≥ 20
    block_bolt:      {value: 25,  category: boldness,   enabled: true}   # §7.1 [Proposta] D-30: bloqueio que anula golpe ou parafuso que acerta
    stun:            {value: 40,  category: boldness,   enabled: true}   # §7.1 [Proposta] D-30: golpe do Atacador que atordoa
    chase_escape:    {value: 30,  category: boldness,   enabled: true, min_time: 15}  # §7.1 [Proposta] D-30: perseguição > 15 s sem ser capturado. LACUNA: perseguição > 15 s ainda em curso no fim da partida (limite de tempo ou caçador a 0) também credita quem segue livre
    trap_disarm:     {value: 15,  category: boldness,   enabled: true}   # §7.1 [Proposta] D-30: desativar armadilha
    escape:          {value: 100, category: survival,   enabled: true}   # §7.1 [Proposta] D-30: escapar
  # Pontos do caçador (§7.1, linha sob a tabela; sem marca de status): desligados por D-31 (a) até a fase 3 (D-09).
  # LACUNA §7.1: o GDD não dá categorias ao caçador; o placar dele é um total.
  hunter_events:
    capture:     {value: 50,  enabled: false}                # captura (sobrevivente vai à gaiola)
    hit:         {value: 15,  enabled: false}                # golpe corpo a corpo que causa dano
    kill:        {value: 100, enabled: false}                # abate (sobrevivente morre)
    long_chase:  {value: 30,  enabled: false, min_time: 15}  # perseguição longa: captura ao fim de perseguição > 15 s
    reveal:      {value: 20,  enabled: false}                # revelação eficaz: acerto em sobrevivente revelado (1 por revelação)
    deny_rescue: {value: 40,  enabled: false}                # evitar resgate: acerto em quem está resgatando

# ---------- 7. Economia (D-04 b: 1 moeda por ponto, skins 8× mais caras que no protótipo) ----------
# moedas = base_coins + win_coins × vitória + pontos × points_to_coins (GDD-v0.2 §7.2; GDD-v0.3 D-04); pontos já com points_mult.
# win_coins_to (v1): quem recebe o bônus de vitória quando a equipe vence. `alive` = todos os vivos do time vencedor
# (comportamento do R1); `escaped` = só quem escapou. `alive`: decisão do Rodrigo 09/11/2026 (pergunta 1 da sessão
# Visual), diverge da leitura literal do GDD v0.3 §3.3 item 1.
economy: {start_coins: 150, base_coins: 20, win_coins: 30, points_to_coins: 1.0, win_coins_to: alive}
skins:   # preço em moedas; protótipo: 0 / 100 / 80 / 120 / 150 / 200 / 250
  std: 0
  abo: 800
  som: 640
  neo: 960
  car: 1200
  our: 1600
  fan: 2000

# ---------- 8. Classes (GDD-v0.2 §2.3, Apêndice A) ----------
classes:
  healer: {pulse_heal: 45, pulse_radius: 6, cooldown: 10}
  mechanic:
    turbo: {cooldown: 14, range: 3}
    bolt: {damage: 6, slow: 0.5, slow_time: 3, cooldown: 6, range: 8}
    puzzle_zone: 0.4
    bot_puzzle_time: 6
  fighter:
    strike: {damage: 12, stun: 3, cooldown: 5, range: 3.2}
    block: {time: 5, cooldown: 8}
  repeat_penalty: {cooldown_base: 1.5, effect_step: 0.3}   # GDD-v0.2 §5.1
  upgrade_caps: {min_cooldown_mult: 0.5, max_effect_mult: 1.5}

# ---------- 9. Dificuldade (GDD-v0.2 §7.3; perseguição escalada ×4,3/3,9 pela D-03 b) ----------
difficulty_table:
  easy:      {hunter_hp: 60,  chase: 3.9, melee_cd: 2.2, detect: 9,  reveal: 35, cage: 90, gate: 35, zone_mult: 1.3,  projectile_dmg: 6,  trap_interval: 40, points_mult: 0.8}
  normal:    {hunter_hp: 80,  chase: 4.3, melee_cd: 1.7, detect: 11, reveal: 28, cage: 75, gate: 45, zone_mult: 1.0,  projectile_dmg: 8,  trap_interval: 32, points_mult: 1.0}
  hard:      {hunter_hp: 100, chase: 4.6, melee_cd: 1.4, detect: 13, reveal: 22, cage: 60, gate: 55, zone_mult: 0.8,  projectile_dmg: 10, trap_interval: 26, points_mult: 1.3}
  nightmare: {hunter_hp: 120, chase: 5.0, melee_cd: 1.2, detect: 15, reveal: 18, cage: 45, gate: 60, zone_mult: 0.65, projectile_dmg: 12, trap_interval: 20, points_mult: 1.6}

# ---------- 9b. Comportamentos do protótipo fora do GDD (docs/prototipo-paridade.md §2) ----------
prototype_extras:
  interact_range: {generator: 2.6, trap: 2.0}          # P-01
  camera: {fov: 72, shoulder: 0.8, distance: 3.6, height: 2.3, wall_step: 0.3}   # P-02
  heartbeat: {radius: 20, base_interval: 0.35, range_interval: 1.1}             # P-03
  vignette_radius: 16                                   # P-04
  mechanic_bot_trap_immune: true                        # P-06
  bolt_aim_cos: 0.6                                     # P-07 (cone de ±53° para o jogador)
  fighter_strike_cd_on_miss: true                       # P-08
  projectile_life: 2.0
  gate_exit_half_width: 3.2
  chase_speed: 3.9                                      # paridade da fase 0 (D-03 b muda o jogo para 4.3)
  # números internos do protótipo, sem equivalente no GDD (docs/prototipo-paridade.md; L = linha do protótipo)
  hunter_initial: {dash: 6, projectile: 6, trap: 14, reveal: 20}   # L106-107: recargas no início da partida
  patrol: {range: 50, reach: 2}                         # L163: ponto de patrulha sorteado em ±25 m
  projectile_hit_radius: 0.8                            # L146
  sidestep: {time: 0.7, angle: 1.2, min_progress: 0.4}  # L129: desvio ao travar em parede
  cage_slot_spacing: 0.7                                # L125
  rescued_offset: 2.5                                   # L127
  stamina_min_to_run: 5                                 # L138
  bot:                                                  # L172-181
    heal_threshold: 65
    mechanic_bolt_dist: 8
    fighter_block_dist: 4
    fighter_engage_dist: 7
    fighter_chase_stunned_dist: 8
    fighter_strike_dist: 2.6
    flee_dist: 9
    rescue_min_hunter_dist: 16
    reach: 1.9
    gate_speed: 4
    wait_point: [0, -24]
    wait_reach: 3

# ---------- 10. Partida (GDD-v0.3 §3.3 revisto) ----------
match:
  prep_time: [10, 20]
  hunter_spawn_min_dist: 35
  hard_time_limit: 600              # D-02 a
  team_min_escapes: 1               # D-01 b: basta 1 escapar

# ---------- 11. IA (GDD-v0.3 §8) ----------
ai:
  # Caçador do ruleset v1 (item R3). "basic" = caçador mínimo do R1 (age a 60 Hz, sem tempo de reação; é o que a
  # suíte rules-v1 fixa); "utility" = IA do GDD-v0.3 §8 (percepção e decisão a 10 Hz, estados do §8.2, utilidade do
  # §8.3, dificuldade do §8.4, navegação do §8.6). Padrão "utility" desde o marco MJ-B (com a D-35 e a D-36 do R4);
  # testes de regra que não dependem da IA fixam "basic" explicitamente.
  hunter_brain: utility
  # Bots aliados do ruleset v1 (item R4, GDD-v0.3 §8.5). "prototype" = bots do protótipo (updateBot, paridade);
  # "competent" = ai/bots.ts (personalidades, fuga para loop, stamina e percepção do jogador). No ruleset prototype
  # vale sempre "prototype". Padrão "competent" desde o marco MJ-B (R4 passou na prova: PR #50, D-35/D-36).
  bot_brain: competent
  decision_hz: 10
  perception_hz: 10
  hearing_investigate_time: 8
  target_weights: {proximity: 0.35, generator_progress: 0.25, injured: 0.20, isolated: 0.15, protected: -0.25}
  target_switch_margin: 0.15
  isolated_radius: 8
  protected_radius: 4
  # Números técnicos da IA sem valor no GDD (LACUNA registrada no relatório do R3; valores conservadores):
  patrol_reach: 2                   # §8.2: chegou ao gerador/portão da patrulha (mesmo valor do protótipo, prototype_extras.patrol.reach)
  search_radius: 6                  # §8.1: ao chegar ao ponto investigado, vasculha pontos sorteados até esta distância
  loop_band: 1.6                    # §8.4: alvo "no loop" se estiver a até isto da rota do loop (= maps.corridor_min, largura mínima da rota)
  static_target_speed: 0.5          # §8.4 "alvo parado": velocidade percebida abaixo disto
  search_samples: 8                 # §8.1 (LACUNA): amostras por sorteio de ponto de vasculha (fica o mais distante já navegável)
  # D-35 (§8.1 memória, §8.2; valor LACUNA): sem o alvo à vista o caçador segue em Perseguir enquanto a memória vale; ao chegar à
  # última posição conhecida, projeta a fuga tantos metros na direção da última velocidade percebida
  chase_projection: 6
  # D-35 (LACUNA): ao expirar a memória, Investigar em volta do último ponto por tanto tempo (= hearing_investigate_time
  # hoje; campo próprio porque não é audição). Ruído ouvido durante a perseguição pela memória é ignorado (LACUNA: o
  # caçador não sabe quem o fez; segui-lo trocaria de alvo sem vê-lo).
  memory_investigate_time: 8
  # R8 passo 1 (D-46; GDD-v0.3 §8.4 e §9.1 "dash e projétil quebram loops"; valor LACUNA): ao reencontrar o alvo
  # perseguido ferido (vida < survivor.wounded_hp) a menos disto, o dash vem antes do projétil. 6 m ≈ percurso do
  # dash (hunter.dash.speed × duration = 3,85 m) + alcance do golpe (hunter.melee.range = 1,8 m) = 5,65 m: o dash
  # termina no alcance do golpe. A faixa de uso do dash (hunter.dash.min..max, GDD-v0.2 §2.3) continua valendo.
  dash_reacquire_dist: 6
  by_difficulty:
    easy:      {reaction: 0.6,  projectile_lead: none,          loop_knowledge: none,    memory: 4}
    normal:    {reaction: 0.4,  projectile_lead: none,          loop_knowledge: partial, memory: 8}
    hard:      {reaction: 0.25, projectile_lead: linear,        loop_knowledge: full,    memory: 12}
    nightmare: {reaction: 0.15, projectile_lead: linear_static, loop_knowledge: avoid_long, memory: 15}
  loop_partial_laps_before_break: 2
  anti_stuck: {min_progress_ratio: 0.4, window: 0.7}
  stuck_fail_after: 3               # critério T-03: deslocamento < 40% por > 3 s com caminho válido = trava
  bots:
    # GDD-v0.3 §8.5: Cauteloso foge a 12 m e evita bônus; Ousado foge a 7 m e prioriza bônus; Altruísta foge a 9 m e
    # prioriza resgate e cura. Sorteio uniforme pelo PRNG da partida. rescue_priority "high" = resgata mesmo com o
    # caçador por perto (batimento ligado), desde que não o saiba a menos de flee_dist da gaiola; "normal" = só sem
    # batimento e sem o caçador conhecido a menos de rescue_safe_dist da gaiola. look_on_heartbeat (LACUNA): no
    # quebra-cabeça a câmera fica no gerador; true = ao ouvir o batimento (prototype_extras.heartbeat) olha em volta
    # depois do tempo de reação; false (Ousado) = segue consertando até ver o caçador no campo da câmera ou levar dano.
    # heal_below (LACUNA, opcional): Curandeiro usa o pulso com alguém no raio a esta vida ou menos; sem o campo,
    # survivor.hp − classes.healer.pulse_heal (aproveita a cura inteira). O Altruísta cura mais cedo (§8.5).
    personalities:
      cautious:  {flee_dist: 12, bonus: avoid,  rescue_priority: normal, look_on_heartbeat: true}
      bold:      {flee_dist: 7,  bonus: prefer, rescue_priority: normal, look_on_heartbeat: false}
      altruist:  {flee_dist: 9,  bonus: avoid,  rescue_priority: high,   look_on_heartbeat: true, heal_below: 80}
    puzzle_fail_rate: 0.15          # §8.5: a falha emite o mesmo ruído e a mesma regressão do jogador (GDD-v0.2 §6.2)
    # §8.5: reação a pings de 0,3 a 0,8 s. LACUNA: o sim não tem pings (vivem no HUD, packages/client/src/hud/ping.ts);
    # o atraso sorteado nesta faixa vale para os eventos que o sim já emite (aliado preso, gerador revelado, ruído),
    # para reagir ao caçador que acaba de aparecer (reactAt) e para olhar em volta ao ouvir o batimento (lookAt).
    ping_reaction: [0.3, 0.8]
    # Números técnicos sem valor no GDD (LACUNA registrada no relato do R4; valores conservadores):
    sight_radius: 30                # §8.1 "o que um jogador veria": = render.fog.far (névoa total aos 30 m), com linha de visão
    glance_interval: 1.5            # fora de interação, olha em volta (360°) a cada isto; entre olhadas vale o campo da câmera
    memory: 5                       # s que o bot confia na última posição vista do caçador
    calm_time: 4                    # s sem ver o caçador para encerrar a fuga
    stamina_resume: 30              # depois de esgotar a stamina, anda até recuperar isto (histerese; regra de correr = a do jogador)
    defend_dist: 4                  # habilidade de defesa (bloqueio do Atacador, parafuso do Mecânico) só com o caçador visível a até isto (= prototype_extras.bot.fighter_block_dist)
    rescue_safe_dist: 16            # rescue_priority normal (= prototype_extras.bot.rescue_min_hunter_dist)
    danger_radius: 12               # evita gerador a até isto de um perigo conhecido (gerador revelado, falha ouvida)
    bonus_prefer_mult: 0.5          # bonus "prefer": distância a gerador bônus conta × isto na escolha
    flee_probe: 6                   # fuga sem loop por perto: pontos de teste a esta distância
    flee_probe_dirs: 8              # ... em tantas direções igualmente espaçadas

# ---------- 12. Navegação (GDD-v0.3 §8.6) ----------
nav:
  cell_size: 0.1
  cell_height: 0.1
  agent_radius: 0.5                 # maior agente (caçador)
  agent_height: 2.5
  walkable_climb: 0.3
  walkable_slope_deg: 40
  fallback_grid: 0.5                # grade A* de reserva (GDD-v0.3 §8.6)
  # Tolerância de consulta (técnica, GDD-v0.3 §8.6/§9.1): distância máxima entre um ponto pedido e o ponto
  # mais próximo do navmesh/grade para valer como "no caminho". Igual à célula da grade de reserva.
  query_snap: 0.5

# ---------- 13. Mapas (GDD-v0.3 §9) ----------
maps:
  corridor_min: 1.6                 # §9.1: navmesh com raio corridor_min/2 conecta todas as áreas jogáveis
  wall_height: 3.4
  side: [60, 80]
  loop_short_perimeter: [8, 12]
  loop_long_perimeter_min: 18
  loop_advantage: [6, 10]           # §9.1: medido no simulador (R5); o validador não mede
  loop_coverage_radius: 20
  loop_coverage_min: 0.9
  hideouts_min: 3
  generator_min_dist: 25            # §9.1: distância no navmesh entre geradores obrigatórios, em todos os layouts
  generator_layouts: [3, 4]         # §9.3: 3 a 4 layouts de geradores por mapa
  cage_positions: 2                 # §9.3
  exits: 2                          # §9.3
  layout_hunter_dist_spread_max: 0.2  # §9.3 aceite: (maior − menor) ÷ menor distância média caçador → geradores
  short_loops_min: 1                # D-23 (Rodrigo, 09/11/2026; GDD-v0.2 §9.1 loops curtos 8–12 m): o mapa v1 com pilares tem ≥ 1 loop curto
  # Item R7-mapas (docs/plano-construcao.md §7): mudanças de mapa só do ruleset v1, cada uma atrás de uma flag para
  # medir o efeito isolado no simulador. O protótipo (ruleset: prototype) usa sempre o mapa de topo (paridade).
  v1:
    fifth_generator: true           # D-22 a: 5 obrigatórios para equipes de 4–5 (generator.by_team_size; GDD-v0.2 §3.5); inerte com 3 sobreviventes
    # D-25 b: ligada depois que o cliente passou a desenhar o portão lateral pela arena da partida (PR #79,
    # render/scene.ts gatePose/addGate/placeCage; revisão do R7-mapas, B-1).
    # D-23 b: o cliente já desenha cfg.map.walls (#79), mas segue desligada pela LACUNA abaixo: com os pilares ligados,
    # a mediana de perseguição do Difícil caiu de 29,9 s para 2,2 s na linha de base (50 partidas, 20 episódios),
    # sinal de golpe pela quina. Ligar depois de o golpe conferir linha de visão ou de o pilar crescer.
    short_loop_pillars: false       # D-23 b: 2–3 pilares com loops curtos de 8–12 m (GDD-v0.2 §9.1)
    side_exit: true                 # D-25 b: segunda saída na parede lateral, longe dos spawns (GDD-v0.3 §9.3)
    # LACUNA (revisão do R7-mapas): o pilar de 1 × 1 m deixa o caçador acertar sem linha de visão pela quina:
    # alcance do golpe hunter.melee.range = 1,8 m contra ~1,45 m entre os centros de caçador e sobrevivente em lados
    # opostos da quina (medido na revisão do R7-mapas); o golpe não confere linha de visão. Possível pilar de 1,6–2 m
    # no R8 (a medir no simulador).

# ---------- 14. Render (GDD-v0.3 §10) ----------
render:
  default_preset: medium            # GDD-v0.3 §10.2: Médio é o padrão
  presets:
    low:    {internal: [320, 180], layers: [A], shadows: false}
    medium: {internal: [384, 216], layers: [A, B], shadows: true}
    high:   {internal: [480, 270], layers: [A, B, C], shadows: true}
  # GDD-v0.3 §10.1: intensidades de 0 a 1 por efeito (menu de acessibilidade, V8).
  # snap = vertex snapping na grade de 1/snap_grid da largura da tela; affine = UV sem correção de perspectiva;
  # gouraud = iluminação por vértice (C-12); dither = Bayer 4×4 + quantização para color_bits por canal.
  ps1: {snap: 1.0, snap_grid: 128, affine: 1.0, gouraud: 1.0, dither: 1.0, color_bits: 5}
  tessellate: 2                     # m; GDD-v0.3 §10.1 item 2: chão e paredes subdivididos (limita a distorção afim e dá vértices ao Gouraud)
  fog: {near: 3, far: 30}
  camera: {near: 0.1, far: 60, eye_height: 1.5}   # prototype/the-hell.html L93 (near/far) e L188 (olho em 1ª pessoa)
  lights: {ambient: 0.9, player: 1.2, player_decay: 1, player_height: 2.5}   # prototype/the-hell.html L94 e L189 (paridade); × π no código (three.js atual sem unidades físicas)
  player_light_radius: 24
  anim_fps: 12
  shadow_map: 256                   # px; GDD-v0.3 §10.2 (sombra dos presets Médio e Alto), GDD-v0.2 §10.2 camada B
  # GDD-v0.3 §10.2, camada A (todos os presets; itens em GDD-v0.2 §10.2): intensidades de 0 a 1 por efeito
  # (menu de acessibilidade, V8), aplicadas no passe final antes do dither (o dither absorve o grão).
  # Cores por token de data/art/palette.json. Os demais números são a calibração para o marco A3.
  layer_a:
    grain: 1.0                      # "grão de filme"
    grain_amount: 0.035             # amplitude máxima (cor linear 0..1) com grain = 1
    grain_fps: 12                   # Hz; troca do padrão no relógio da simulação (= render.anim_fps, passo PS1)
    vignette: 1.0
    vignette_radius: [0.5, 1.1]     # distância ao centro (canto = 1) onde a vinheta começa e onde chega ao máximo
    vignette_amount: 0.6            # escurecimento máximo com vignette = 1
    scanlines: 1.0                  # "scanlines leves"
    scanline_amount: 0.1            # linha escura 10% mais escura com scanlines = 1
    aberration: 1.0                 # "aberração cromática ao receber dano"
    aberration_px: 2                # deslocamento máximo de R e B (pixels internos) no canto da tela
    aberration_time: 0.4            # s; o pulso decai até 0 depois do dano (relógio da simulação)
    bloom: 1.0                      # "bloom leve nos emissivos (feixes, lâmpadas)": só materiais emissivos
    bloom_radius_px: 3              # raio do brilho em pixels internos
    bloom_amount: 0.6
    lut: 1.0                        # "LUT de cor fria"
    lut_size: 16                    # LUT 3D de 16³
    lut_tint: world.fog             # token: tom puxado nas sombras
    lut_tint_amount: 0.045          # deslocamento máximo (cor linear) do canal dominante do croma do token, no preto
    lut_shadow_pivot: 0.35          # luminância até onde vale o tom das sombras
    lut_gain: [0.93, 0.98, 1.06]    # ganho R, G, B (esfria os tons médios e altos)
    lut_saturation: 0.85            # 1 = igual; cor saturada continua informação (Art Bible §1)
  # GDD-v0.3 §10.2 e §12.4: "a aberração cromática e o grão respeitam a opção reduzir flicker".
  # Multiplicadores com a opção ligada; o grão também deixa de animar (padrão fixo).
  reduce_flicker: {grain: 0.35, aberration: 0}
  # GDD-v0.3 §10.2, camada B (Médio e Alto): lanterna com cone e sombra de shadow_map px; luz assada nos vértices.
  layer_b:
    # intensidade × π no código (como render.lights); angle_deg = meia abertura do cone; height, forward e side (m):
    # posição na mão, à frente e à direita do jogador (luz fora do olho, para a sombra aparecer)
    lantern: {color: light.jogador, intensity: 7, distance: 18, decay: 1, angle_deg: 28, penumbra: 0.35, height: 1.5, forward: 0.35, side: 0.3, shadow_bias: -0.002}
    caster_radius: 1.3              # m; esfera que envolve um personagem no recorte da sombra (caçador de 2,5 m, Art Bible §3)
    # luz assada: oclusão perto dos muros (chão e base das paredes) e poça de luz das lâmpadas dos geradores
    bake: {ao_min: 0.45, ao_radius: 2.5, light_color: light.ambiente, light_intensity: 1.2, light_radius: 6, light_height: 1.2}
  # GDD-v0.3 §10.2, camada C (só Alto). O v0.3 não detalha a camada; itens do GDD-v0.2 §10.2. Implementados:
  # névoa volumétrica barata (billboards) e partículas de poeira. Decals e poças: LACUNA (sem posições no mapa).
  layer_c:
    fog_billboards: {color: world.fog, count: 60, size: [6, 12], height: [0.6, 2.4], opacity: 0.2, drift: 0.6, drift_speed: 0.15, near_fade: 4}
    dust: {count: 320, box: 12, size_px: 1, opacity: 0.6, ambient: 0.25, color: world.gaiola, fall: 0.06, sway: 0.25}   # ambient: visibilidade fora do cone da lanterna
  budgets: {fps: 60, draw_calls: 150, triangles: 60000, initial_download_mb: 15, map_download_mb: 40, time_to_play_s: 5}
  # V7 (F2-07; GDD-v0.3 §10.6, "cena de pior caso: 6 personagens, mapa inteiro, efeitos"): cena do parâmetro de
  # depuração ?stress=1 (render/stress.ts), medida por tools/perf/budget.mjs. distance e spacing (m): grupo do caçador
  # e dos aliados à frente do jogador, dentro do cone da lanterna (render.layer_b.lantern.angle_deg); margin (m): folga
  # da vista de cima em volta do mapa; sweep: rumos da varredura em 3ª e em 1ª pessoa; network_mbps: rede limitada do
  # "tempo até jogar" (GDD-v0.3 §10.6: "Playwright com rede limitada a 25 Mbit/s")
  stress: {distance: 8, spacing: 1.4, margin: 2, sweep: 8, network_mbps: 25}
  # custo das camadas (plano-fases-1-2 §5 V4 e V7; revisão do V4): tempo de render do preset médio com A+B dividido
  # pelo mesmo preset sem camadas, medido de forma síncrona no SwiftShader a 1280×720 (tools/visual/compare.mjs,
  # tempo de CPU do processo de GPU, mediana de 11 pares). Medido em 08/11/2026 com a máquina carregada: 1,25 a 1,38×
  # (antes das otimizações: 1,87×). Teto com folga para o ruído; a meta da revisão é 1,3×. V7 (09/11/2026): mediana de
  # 21 pares de 32 quadros, na vista das capturas e com o caçador no cone da lanterna; com a máquina carregada (load
  # ~10 em 4 núcleos): mediana 1,35× (mín 1,11×, p90 1,43×, máx 1,46×) e 1,33× no cone (1,15×, 1,40×, 1,43×).
  # Na CI (sem GPU; SwiftShader na CPU) a razão depende do tipo de runner: runners de ~34–49 ms/quadro sem camadas
  # dão 1,26–1,32×, runners de ~65 ms dão 1,39–1,43× (o PR #53 falhou com 1,43×). D-44 (supervisão por delegação do
  # Rodrigo, 09/11/2026; docs/plano-construcao.md §7): na CI a medida é proxy de regressão (render.cost_check abaixo);
  # o teto de 1,4× vale para hardware real e a otimização de bloom/dither segue; subir o teto foi rejeitado.
  # D-51 (supervisão por delegação do Rodrigo, 09/11/2026): D-44 (a) encerrada com os ganhos bit a bit idênticos do
  # PR #81; a folga até 1,3× deixa de ser meta. 1,4× segue como orçamento de hardware (procedimento manual da UHD 620
  # em docs/runbook.md); na CI a razão só aparece no log e no resumo do job (portão em ms/quadro, main_rel_delta abaixo)
  layer_cost_factor: 1.4
  # D-44 (b): como tools/visual/compare.mjs mede o custo das camadas contra layer_cost_factor (tools/visual/cost-stats.mjs).
  # pairs pares intercalados ABBA (A = sem camadas, B = A+B), cada medida com warmup quadros descartados e frames
  # quadros medidos; razão pareada B/A; IC da mediana por bootstrap percentil com nível ci, bootstrap_resamples
  # reamostragens e PRNG mulberry32 com semente seed (determinístico: mesmas razões, mesmo IC). A CI falha só se o
  # limite inferior do IC passar de layer_cost_factor × (1 + ci_runner_margin) (regressão certa); aviso, sem falha,
  # se a mediana passar de layer_cost_factor. ci_runner_margin 0,07 (D-44, opção a da supervisão): o tipo de runner
  # enviesa a razão no SwiftShader (1,26–1,43× medidos na CI para o mesmo código, acima), então o teto da CI é
  # 1,4 × 1,07 ≈ 1,50×. Não sobe o orçamento de hardware (layer_cost_factor segue 1,4, conferido no procedimento manual
  # da UHD 620 em docs/runbook.md)
  # pairs e frames: os do V7 (21 × 32); warmup: os 2 quadros que já eram descartados ao trocar de camadas. pairs ≥ 5
  # (schema): com menos pares a mediana reamostrada só assume poucos valores distintos e o IC percentil degenera
  # (com 1 par o IC é um ponto, e a regra "falha só se o limite inferior passar" vira a regra da mediana crua)
  # ci_mode (D-48, supervisão por delegação do Rodrigo, 09/11/2026; docs/plano-construcao.md §7): warn | fail. Em warn
  # o resultado de falha do custo das camadas vira aviso visível (anotação ::warning e resumo do job) e não reprova a
  # CI; o resto de tools/visual/compare.mjs e os portões de tools/perf/budget.mjs (draw calls, triângulos, download)
  # seguem reprovando. Motivo: viés do tipo de runner; um runner novo com base 36,3 ms/quadro sem camadas mediu 1,52×
  # (IC [1,52, 1,53]) em 09/11/2026 num PR que não mexe no render (PR #68, job 128986770134), acima do teto da CI 1,50×.
  # PRAZO cumprido: volta para fail com a issue #59 (D-49, abaixo)
  # main_delta (D-49, issue #59; supervisão por delegação do Rodrigo, 09/11/2026; docs/plano-construcao.md §7): na CI
  # o build de main é medido no mesmo job e na mesma máquina, em rodadas intercaladas com o PR (crossOrder em
  # tools/visual/cost-stats.mjs; pairs rodadas). A CI reprova só se o limite inferior do IC da mediana de (razão do PR −
  # razão de main) passar de main_delta; aviso se a mediana passar. Imune ao tipo de runner: o viés (1,26–1,52× para o
  # mesmo código, acima) afeta os dois builds igual. 0,05 = a proposta da issue #59: 2,5× a meia largura do IC de uma
  # razão num run (IC [1,28, 1,32] com a dispersão do PR #53; [1,52, 1,53] no PR #68); para código igual com ruído
  # independente nos dois builds o IC da diferença fica em [−0,04, +0,05] (packages/client/test/cost-stats.test.ts),
  # então lo > 0,05 só com regressão real, e uma alta de 0,10 na razão do PR já reprova (mesmo teste).
  # main_delta virou main_ratio_delta com D-51 (abaixo), como metade do critério duplo.
  # Complemento de D-49 (supervisão por delegação do Rodrigo, 09/11/2026): sem build de main
  # utilizável (build ausente, main sem o gancho de custo, exceção do lado de main) a comparação não é feita e fica só
  # um aviso, sem portão absoluto (costGateOutcome em tools/visual/cost-stats.mjs)
  # main_rel_delta e main_ratio_delta (D-51 com a emenda do critério duplo, supervisão por delegação do Rodrigo,
  # 09/11/2026; docs/plano-construcao.md §7; substitui o critério de D-49): por rodada de crossOrder, rel_AB =
  # PR_AB / main_AB − 1 (ms/quadro com A+B) e Δrazão = razão do PR − razão de main (A+B ÷ sem camadas). A CI reprova
  # só se os DOIS limites inferiores dos IC (nível ci) passarem: rel_AB > main_rel_delta (+5%) E Δrazão >
  # main_ratio_delta (+0,05, o antigo main_delta); aviso se qualquer mediana passar do seu limite. Motivo: a razão
  # sozinha penaliza otimizar a base (o denominador encolhe); rel_AB sozinho reprova um viés de quadro inteiro entre os
  # builds (run 42578537893, PR #80, sem mudança de render: A+B 46,6 contra 49,4 ms/quadro, −5,7%, com Δrazão −0,01).
  # Juntos, só a regressão das camadas reprova; uma lentidão só da base passa (aceito pela supervisão: perf:budget e o
  # smoke cobrem). Ruído independente nos dois builds com a dispersão do PR #53: código igual dá IC de rel_AB dentro de
  # [−3%, +4%]; +10% só em A+B reprova, +2% passa, +6% no quadro inteiro passa (packages/client/test/cost-stats.test.ts).
  # warmup_rounds (D-51, investigação do viés): rodadas de crossOrder medidas e descartadas em cada vista antes das
  # pairs rodadas, para os dois builds chegarem às medidas com o mesmo aquecimento (a aba do PR abre antes, e o PR já
  # desenhou as capturas no mesmo navegador)
  cost_check: {pairs: 21, frames: 32, warmup: 2, bootstrap_resamples: 2000, ci: 0.95, seed: 44, ci_runner_margin: 0.07, ci_mode: fail, main_rel_delta: 0.05, main_ratio_delta: 0.05, warmup_rounds: 1}
  # legibilidade depois da camada A (Art Bible §5.3; revisão do V4), medida em tools/visual/compare.mjs: olhos do
  # caçador no preparo e feixes ≥ min_contrast contra o fundo (WCAG 2.2 1.4.11, 3:1, o mesmo da paleta); o corpo do
  # caçador fora do cone conserva body_keep do contraste que tem sem a camada A, sem o contorno de D-18 (intensidade 0,
  # V8) e com ele. D-38 (supervisão por delegação do Rodrigo, 09/11/2026; docs/plano-construcao.md §7): body_keep
  # 0,89 (era 0,9). A Art Bible §5.3 (3:1) tem precedência sobre esta métrica interna: com a camada A as scanlines
  # (≈ 0,8 em luminância linear) e o tom de sombra da LUT tiram ≈ 10% do contraste de todo corpo claro, e nenhum
  # ponto potência × amount do contorno dá 3:1 e 0,9 juntos (tabela em hunter_outline abaixo; PR #34)
  legibility: {min_contrast: 3, body_keep: 0.89}
  # D-18 (b, 09/11/2026; docs/plano-construcao.md §7): contorno sutil no caçador para a legibilidade fora do cone da
  # lanterna (Art Bible §5.3: 3:1, WCAG 2.2 1.4.11) sem clarear a cena (luz ambiente e névoa intactas). Borda de luz
  # por vértice (fresnel) no Ps1Material do caçador: cor = token × amount, somada antes da névoa; power = expoente do
  # fresnel (maior = borda mais fina). intensity de 0 a 1 (acessibilidade, V8). Fixo no tempo (sem pulsar: "reduzir
  # flicker", GDD-v0.3 §12.4). Medido em tools/visual/compare.mjs (corpo fora e dentro do cone ≥ legibility.min_contrast)
  # amount × token ≤ 1 por canal (sem branco saturado; hunter.espectro tem máx. 206/255, então amount ≤ 1,23).
  # Escolha (revisão do PR #34, 09/11/2026; máscara do corpo inteiro): power 1 e amount 1,15 dão 3,21:1 fora do cone
  # e conservam 0,897 com a camada A. Nenhum ponto da tabela potência × amount (0,6 a 4 × 0,6 a 1,23) dá 3:1 e
  # body_keep ≥ 0,9 ao mesmo tempo. Resumo (fora do cone, contraste / fração conservada): power 1 × amount 0,6 / 1,0 /
  # 1,2 = 1,99 / 0,926, 2,84 / 0,904, 3,34 / 0,895; power 1,5 × 1,2 = 2,54 / 0,908; power 2 × 1,2 = 2,12 / 0,911;
  # power 3 × 1,2 = 1,75 / 0,930; power 4 × 1,2 = 1,59 / 0,939; power 1 × 1,05 = 2,96 / 0,900 (opção fraca, capturas
  # *-fraco em docs/art/marcos/a3). D-38 fixa body_keep em 0,89 e mantém este ponto
  hunter_outline: {intensity: 1.0, color: hunter.espectro, amount: 1.15, power: 1}
  models:
    survivor_tris: [300, 600]
    hunter_tris: [800, 1200]
    atlas: 64
    # D-45: modelo de reserva (caixa na cor da classe ou do caçador) enquanto o .glb não chega ou se ele falhar; o caçador
    # tem olhos que acendem no preparo como os do modelo (telegraph, Art Bible §1.5 e §4). Medidas de arte em metros:
    # altura do sobrevivente = altura do manifesto (1,75 m) e do Espectro 2,5 m (plano-fases-1-2 §5 V2); eyes = largura,
    # altura e profundidade da faixa dos olhos, eyes_below = distância do topo da caixa ao centro dos olhos
    fallback: {survivor: [0.6, 1.75, 0.4], hunter: [0.7, 2.5, 0.5], eyes: [0.4, 0.1, 0.05], eyes_below: 0.3}
  # V3 (F2-03): leitura de estado no jogo (Art Bible §4). Frequências da tabela da §4; o resto é medida de arte.
  states:
    # feixe do gerador: largura e altura (m); min_px = largura mínima na resolução interna (o feixe distante não vira
    # tracejado, achado da revisão do V1); snap = intensidade do vertex snapping só no feixe (0: a linha não quebra de longe)
    beam: {width: 0.25, height: 14, min_px: 1.5, snap: 0}
    lamp: {size: [0.4, 0.3, 0.4], height: 1.2}       # lâmpada no topo do gerador (mesmo padrão do feixe)
    pending_hz: 1                                    # pendente: pisca devagar, 1 vez por segundo
    pending_duty: 0.5                                # fração do ciclo do pendente com o feixe aceso
    # V8 (GDD-v0.3 §12.4 "redução de flicker"): com a opção ligada o pendente não apaga; alterna aceso e esta fração
    # do brilho (o "pronto" continua contínuo, então o padrão segue distinto, Art Bible §4). LACUNA (GDD e Art Bible
    # não definem a fração). Proposta: 0,5, metade do brilho, ainda ≥ 3:1 sobre a névoa (gen.pendente sobre world.fog)
    pending_reduced_level: 0.5
    progress_hz: 2                                   # em progresso: pulsa 2 vezes por segundo
    progress_pulse: 0.8                              # no pico do pulso a largura do feixe é × (1 + progress_pulse)
    # bônus: espiral de spiral_steps blocos (lado spiral_block) em spiral_turns voltas de raio spiral_radius, girando a
    # spiral_hz voltas por segundo, e losango (octaedro de raio diamond) no topo do feixe
    bonus: {spiral_hz: 0.5, spiral_turns: 3, spiral_steps: 18, spiral_radius: 0.5, spiral_block: 0.18, diamond: 0.45}
    # lampejo horizontal nos olhos do caçador durante o preparo: largura, altura e avanço para a câmera (m; o braço
    # erguido no golpe não o tapa) e altura mínima em pixels da resolução interna (de longe a faixa fina não some;
    # o lampejo, como o feixe, não usa vertex snapping)
    eyes_flare: [0.7, 0.07, 0.35, 2]
    lock: {size: 0.5, above: 0.5}                    # cadeado sobre o aliado preso: lado (m) e altura acima da cabeça (m)
  # D-13, D-14, D-15 (docs/plano-construcao.md §7; item V9 em docs/handoff/plano-fases-1-2.md §5): MOCKUP do modo
  # "Retro FPS" para o mini marco de arte A2b. Só liga com o parâmetro de depuração ?retro=1 (sem opção de menu; a 3ª
  # pessoa continua padrão). Medidas de arte a calibrar depois da aprovação do filho (D-14), não regra de jogo.
  retro:
    # balanço da ferramenta ao andar (D-13: "balanço com intensidade 0–1"; o V8 "reduzir balanço de câmera",
    # GDD-v0.3 §12.4, vai multiplicar `bob`). Amplitude (m: lado, vertical) com bob = 1 na velocidade de corrida
    # (survivor.run); um ciclo a cada `bob_stride` m andados; `bob_return` = fração por quadro de volta ao repouso
    bob: 0.5
    bob_amplitude: [0.03, 0.022]
    bob_stride: 1.6
    bob_return: 0.15
    # ferramenta da classe na mão (D-13): peças da ficha (data/art/personagens.json) presas ao osso `osso` (filtradas
    # por `cores` quando há), com o ponto `origem` (m, coordenadas da ficha) posto em `pos` no espaço da câmera
    # (m; +X direita, +Y cima, −Z frente), giro `rot` (graus, XYZ) e `escala`. Mãos: caixa de pele `hand.size` e
    # antebraço na cor dos braços da ficha, do centro da mão até `pos + antebraco`
    viewmodel:
      fov: 60                       # graus; câmera só da ferramenta (independe do slider de fov do V8)
      far: 10                       # m; plano distante da câmera da ferramenta (a ferramenta está a menos de 1 m)
      light: {ambient: light.ambiente, ambient_intensity: 1.4, key: light.jogador, key_intensity: 1.1, key_pos: [0.6, 0.5, 0.3]}
      hand: {size: [0.075, 0.07, 0.11], forearm: [0.05, 0.045], forearm_sides: 6}   # forearm: raio no punho e no fim; lados do prisma
      classes:
        curandeiro:
          grupos: [{osso: hand_r, origem: [0, 0, 0], pos: [0.28, -0.24, -0.62], rot: [-48, -54, 60], escala: 0.32}]
          maos: [{pos: [0.3, -0.25, -0.62], rot: [-18, 8, 8], antebraco: [0.22, -0.3, 0.45]}]
        mecanico:
          grupos:
            - {osso: hand_r, origem: [-0.12, 0, 0.02], pos: [0.3, -0.24, -0.6], rot: [-12, 60, -80], escala: 0.48}
            - {osso: Head, cores: [char.lanterna], origem: [0, 0.2, 0.17], pos: [-0.28, -0.2, -0.6], rot: [6, -10, 0], escala: 1.4}
          maos:
            - {pos: [0.3, -0.25, -0.57], rot: [-12, 0, 10], antebraco: [0.2, -0.3, 0.45]}
            - {pos: [-0.3, -0.25, -0.57], rot: [-8, 0, -6], antebraco: [-0.2, -0.3, 0.45]}
        atacador:
          grupos: [{osso: spine_03, origem: [-0.2, 0.37, -0.19], pos: [0.32, -0.25, -0.6], rot: [-28, 0, 150], escala: 0.72}]
          maos: [{pos: [0.32, -0.25, -0.6], rot: [-14, 0, 14], antebraco: [0.22, -0.3, 0.45]}]
        protetor:
          grupos: [{osso: lowerarm_l, origem: [0.14, 0.09, 0.026], pos: [-0.36, -0.2, -0.66], rot: [-40, 0, -50], escala: 0.55}]
          maos: [{pos: [-0.24, -0.29, -0.58], rot: [-8, 0, -6], antebraco: [-0.2, -0.3, 0.45]}]
        batedor:
          # LACUNA: a Art Bible §3 e a ficha não dão ferramenta de mão ao Batedor (o acessório é o cachecol); o mockup
          # mostra as mãos livres e a ponta do cachecol entrando pela esquerda (pergunta ao filho no A2b)
          grupos: [{osso: spine_03, cores: [char.cachecol], origem: [0.12, -0.06, -0.3], pos: [-0.42, -0.2, -0.55], rot: [20, 30, -60], escala: 0.55}]
          maos:
            - {pos: [0.26, -0.22, -0.58], rot: [-20, 0, 12], antebraco: [0.2, -0.3, 0.45]}
            - {pos: [-0.22, -0.23, -0.6], rot: [-20, 0, -12], antebraco: [-0.2, -0.3, 0.45]}
    # D-15: variante industrial do Pátio (texturas e iluminação, sem layout novo; catálogo de mapas da v1.0 inalterado,
    # D-06). Texturas procedurais de `texture` px com o PRNG com semente do cliente (render/options.ts); cores só por
    # token world.industrial.* de data/art/palette.json (secundárias, sem mudar tokens aprovados)
    industrial:
      texture: 64
      # parede: chapas rebitadas (plates × plates por ladrilho) com borda iluminada de opacidade `edge_alpha`, rebites
      # de `rivet` px (largura, altura; sombra da mesma altura embaixo) a cada `rivet_step` px a `rivet_inset` px da
      # borda, faixa de segurança diagonal de `stripe` px de altura na base (listras de `stripe_period` px) e `grime`
      # salpicos de sujeira com opacidade na faixa `grime_alpha` e escorrido de `grime_drip` px (faixa [mín, máx))
      wall: {base: world.industrial.parede, edge: world.industrial.chapa, seam: world.industrial.junta, stripe_color: world.industrial.faixa, plates: 2, edge_alpha: 0.5, rivet: [2, 1], rivet_step: 8, rivet_inset: 3, stripe: 10, stripe_period: 8, grime: 90, grime_alpha: [0.25, 0.6], grime_drip: [1, 4]}
      # chão: lajes de concreto com junta na borda do ladrilho; `stains` manchas escuras de `stain_size` px com
      # opacidade em `stain_alpha` e `flecks` salpicos claros de 1 px com opacidade em `fleck_alpha`
      floor: {base: world.industrial.chao, seam: world.industrial.junta, fleck: world.industrial.chapa, flecks: 220, fleck_alpha: [0.2, 0.6], stains: 160, stain_alpha: [0, 0.35], stain_size: 2}
      # luz: ambiente fria no lugar de light.ambiente; luz assada âmbar (camada B) nas lâmpadas dos geradores e em
      # luminárias no topo dos muros, uma a cada `lamp_spacing` m de muro (muros menores que isso ganham uma no centro),
      # a `lamp_offset` m da face; luminária emissiva de `lamp_size` m (uma InstancedMesh: 1 chamada de desenho)
      ambient: world.industrial.luz_fria
      ambient_intensity: 1.5
      bake_color: world.industrial.faixa
      bake_intensity: 3.5
      lamp_token: world.industrial.tubo
      lamp_spacing: 14
      lamp_offset: 0.5
      lamp_size: [1.2, 0.12, 0.25]

# ---------- 15. Áudio (GDD-v0.3 §11) ----------
audio:
  music:
    # A-2 (music.ts / musicState.ts). Um stem por estado musical; o nome é também o arquivo
    # `audio/music/<stem>.mp3` (contrato com o A-3). GDD-v0.3 §11: 5 stems (ambiente, tensão, perseguição,
    # pressão final, resgate).
    stems: [ambient, tension, chase, final_pressure, rescue]
    tension_radius: 25                # GDD-v0.3 §11 e GDD-v0.2 §11: tensão com o caçador a < 25 m
    crossfade_bars: 1                 # GDD-v0.3 §11: crossfade de 1 compasso
    # Andamento, compasso e tom: decisão do Rodrigo, 09/11/2026 (sessão Áudio): 90 BPM, 4/4, Ré menor, síntese PS1
    # pura. Compasso = beats_per_bar × 60 / bpm = 2,667 s; a troca de stem cai no início do compasso seguinte
    # (GDD-v0.3 §11). `key` é lido pela composição procedural (A-3).
    bpm: 90
    beats_per_bar: 4
    key: "D minor"
    # LACUNA (GDD não define): ganho linear do stem ativo (os inativos ficam em 0). Proposta: 1, porque os stems já
    # saem masterizados a −16 LUFS (GDD-v0.3 §11, medido no A-7); o volume do jogador fica no barramento `music`.
    layer_gain: 1
    # LACUNA (GDD não define): constantes de tempo (s) do ducking (GDD-v0.3 §11: −8 dB em eventos críticos).
    # Proposta: ataque 0,05 s (a música abaixa em ~150 ms, junto com o evento) e soltura 0,5 s (volta em ~1,5 s,
    # sem "bombear").
    duck_attack: 0.05
    duck_release: 0.5
    # LACUNA (GDD não define): antecedência (s) entre decodificar os stems e iniciá-los juntos, para que os 5
    # `start(t)` caiam no mesmo instante futuro do relógio de áudio. Proposta: 0,1 s (> 2 quadros a 30 fps).
    start_lead: 0.1
  # A-3 (tools/audio/compose.ts): composição procedural dos stems (docs/handoff/plano-audio-v5.md §2 e §4; decisão do
  # Rodrigo, 09/11/2026: síntese PS1 pura, sem samples). Parâmetros de renderização e masterização, não de jogo.
  compose:
    # 8 compassos = 8 × 4 × 60 / 90 = 21,333 s; dá número inteiro de amostras a 48000 (1 024 000) e a 44100 (940 800),
    # então o loop fecha exato também se o navegador reamostrar para 44,1 kHz. Todos os stems têm esse comprimento
    # (o A-2 inicia os 5 juntos e troca no limite de compasso, GDD-v0.3 §11).
    loop_bars: 8
    # cauda renderizada depois do loop e somada no início (wrap) para release e reverb; tem de ser maior que a
    # nota mais longa + resposta ao impulso do reverb (compose.ts confere e falha se não couber)
    tail_bars: 2
    # semente do PRNG próprio da composição (ruído, reverb, variações); mesma semente → mesmo PCM
    seed: 20261109
    sample_rate: 48000              # Hz; taxa do OfflineAudioContext e do MP3
    bitrate_kbps: 128               # plano-audio-v5 §2: música estéreo 128 kbps (MP3, GDD-v0.3 C-13)
    # LACUNA (GDD não define): folga (dB) abaixo de audio.true_peak_dbtp na masterização do PCM, porque a codificação
    # MP3 sobe o pico real em alguns décimos de dB. Proposta: 0,5 dB.
    true_peak_margin_db: 0.5
    # Masterização (compose.ts). LACUNA (GDD não define; são parâmetros de ferramenta, não de jogo). Propostas:
    limiter_lookahead_s: 0.004      # antecipação do limitador de pico (s): 4 ms, menor que o ataque de qualquer nota
    limiter_release_s: 0.12         # recuperação do limitador (s): 120 ms, sem "bombear" no andamento de 90 BPM
    loudness_match_lu: 0.05         # tolerância da busca de ganho (LU): metade da resolução do ebur128 (0,1)
    master_max_iterations: 16       # tentativas da busca de ganho/limitador antes de falhar
    tail_floor_db: -60              # o fim da cauda renderizada tem de estar abaixo do pico por esta margem (dB)
    # MP3 sem lacuna (compose.ts, music.ts). Pré e pós-rolagem: amostras do próprio loop codificadas antes e depois
    # dele e marcadas como atraso/padding no cabeçalho LAME (2 quadros de 1152; o campo tem 12 bits, ≤ 4095).
    gapless_preroll: 2304
    gapless_postroll: 2304
    # atraso do MP3 antes da 1ª amostra, sem a pré-rolagem: LAME (576) + decodificador (529) = 1105 amostras, medido
    # com ffprobe (start_time 0,023021 s × 48000) e conferido pelo compose.ts no cabeçalho de cada arquivo. O music.ts
    # usa (mp3_lead + gapless_preroll) para achar o loop se um navegador ignorar o cabeçalho LAME.
    mp3_lead: 1105
    # Junção do loop (test/audio-stems.test.ts e tools/audio/check-loop.mjs): o degrau |x[0] − x[N−1]| e a 2ª
    # diferença na junção não podem passar de junction_factor × o maior degrau / a maior 2ª diferença em ±junction_window
    # amostras em volta (sem contar a junção). Calibrado nos 5 stems: natural ≤ 1,30; estalo sintético de 0,02 (qualquer
    # sentido) ≥ 1,55; 1,4 separa os dois. Janela curta porque, com percussão, a vizinhança longa já tem degraus maiores
    # que 0,02 e esconderia o estalo.
    junction_window: 8
    junction_factor: 1.4
  max_voices: 32
  occlusion_lowpass_hz: 800
  loudness_lufs: -16
  loudness_tolerance: 1
  true_peak_dbtp: -1
  # A-7 (tools/audio/loudness.mjs, passo da CI): o que conta como música e quais licenças o creditos.csv aceita.
  # GDD-v0.3 §11 (linha "Mixagem"): a meta de LUFS vale para "todos os arquivos de música"; arquivos de
  # packages/client/public/audio fora de music_dir são efeitos. LACUNA (GDD não define meta de LUFS para efeitos):
  # efeitos só passam pelo pico real (true_peak_dbtp).
  loudness_check:
    music_dir: audio/music          # relativo a packages/client/public/, como a coluna `arquivo` do creditos.csv
    # docs/handoff/plano-fases-1-2.md §3, regra 5: "Assets só CC0 ou de licença aberta compatível". Lista aberta:
    # acrescentar aqui (com a fonte da licença) antes de usar um arquivo com licença nova. Grafia igual à da coluna
    # `licenca` do creditos.csv.
    licenses: ["CC0 1.0", "CC-BY 4.0", "MIT"]
  ducking_db: -8
  # A-1 (engine.ts): volume padrão de cada barramento, ganho LINEAR 0–1 aplicado direto no GainNode (0 = mudo,
  # 1 = sem atenuação). Linear e não dB porque é o valor que o slider mostra e o GainNode recebe, e 0 representa o
  # mudo sem precisar de −∞ dB. Barramentos = os sliders separados de música, efeitos, voz e UI (GDD-v0.3 §11,
  # Mixagem; GDD-v0.2 §11) somados no master.
  # Volume inicial dos sliders (GDD v0.2/v0.3 não definem): D-28 (docs/plano-construcao.md §7), 1 em todos, para a
  # música chegar ao jogador no nível em que foi masterizada (−16 LUFS, GDD-v0.3 §11) e os bipes da fase 0
  # manterem o volume atual.
  buses: {master: 1, music: 1, sfx: 1, voice: 1, ui: 1}
  # D-29 (docs/plano-construcao.md §7; GDD não define): constante de tempo (s) da rampa setTargetAtTime ao mudar um volume. Proposta: 0,02 s
  # (chega a ~95% em 3 constantes = 60 ms), curta o bastante para o slider responder na hora e longa o bastante para
  # não estalar ("zipper noise") com o ganho mudando em degrau.
  volume_ramp_tc: 0.02
  # D-29 (docs/plano-construcao.md §7; GDD não define): atraso (s) para gravar os volumes no localStorage depois da última mudança (o slider
  # arrastado não grava a cada quadro; o ganho muda na hora). Proposta: 0,25 s; também grava ao sair da página
  # (pagehide).
  volume_persist_delay: 0.25
  # A-4 (voices.ts): prioridade por tipo de voz (inteiro; maior = mais importante). Com as audio.max_voices vagas
  # ocupadas, a voz nova derruba a ativa de menor prioridade (a mais antiga entre as empatadas) se a prioridade da
  # nova for maior ou igual; senão é recusada (GDD-v0.3 §11, "limite de 32 vozes por prioridade";
  # docs/handoff/plano-audio-v5.md §1, "a 33ª derruba a de menor prioridade e mais antiga").
  # A ordem segue a legibilidade de jogo: o telegraph é o aviso obrigatório de habilidade do caçador (GDD-v0.3 §11,
  # "Telegraph sonoro"; GDD-v0.2 §11, "parte do telegraph"), depois o caçador e o batimento (ameaça), o gerador
  # (objetivo), os passos, a UI e o ambiente.
  # LACUNA (o GDD não define a tabela nem os valores numéricos): proposta abaixo, decisão do Rodrigo pendente.
  # A-5: `event` (golpe recebido, prisão, resgate, gerador concluído: os "eventos críticos" do ducking, GDD-v0.3 §11)
  # e `breath` (respiração do próprio jogador, GDD-v0.2 §11). LACUNA, proposta: event 85 (abaixo do caçador, acima do
  # batimento) e breath 60 (acima do gerador e dos passos, porque informa a stamina do próprio jogador).
  voice_priority: {telegraph: 100, hunter: 90, event: 85, heartbeat: 80, breath: 60, generator: 50, footstep: 40, ui: 30, ambience: 10}
  # A-4 (spatial.ts): parâmetros do PannerNode de cada voz. panning_model HRTF: GDD-v0.3 §11 e GDD-v0.2 §11.
  # LACUNA (o GDD não define o modelo de distância nem as distâncias). Proposta: "inverse" (padrão da Web Audio,
  # https://webaudio.github.io/web-audio-api/#dom-pannernode-distancemodel): ganho = ref / (ref + rolloff·(d − ref))
  # para d > ref, cheio até ref_distance.
  # ref_distance 4 m: em 3ª pessoa a câmera (o ouvinte) fica a ≈ 3,85 m do personagem (prototype_extras.camera:
  # √(distance² + shoulder² + (height − source_height)²) = √(3,6² + 0,8² + 1,1²) ≈ 3,85 m, sem recuo de parede);
  # com ref 2 um som no personagem sairia a 20·log10(2 / 3,85) ≈ −5,7 dB; com ref 4 sai sem atenuação.
  # max_distance 60 m (= render.camera.far, o que a câmera ainda enxerga; o pátio tem 62 m de lado): no modelo inverse
  # a distância é limitada a max_distance, então o ganho para de cair em ref / max (4/60 ≈ −23,5 dB); não silencia.
  panner: {panning_model: HRTF, distance_model: inverse, ref_distance: 4, max_distance: 60, rolloff_factor: 1}
  # LACUNA (o GDD só fixa o corte de 800 Hz): constante de tempo (s) da rampa setTargetAtTime do passa-baixa quando a
  # voz entra ou sai de oclusão. Proposta: 0,05 s (~95% em 0,15 s), sem estalo ao cruzar a quina de uma parede. Sem
  # oclusão o filtro abre até a frequência de Nyquist do contexto (sampleRate / 2), isto é, fica transparente.
  occlusion_ramp_tc: 0.05
  # LACUNA (o GDD não define): altura (m) padrão da fonte sonora no eixo y do render quando quem toca não informa.
  # Proposta: 1,2 m, perto do peito de um sobrevivente (survivor.height 1,75 m), abaixo do olho da câmera em 1ª pessoa
  # (render.camera.eye_height 1,5 m).
  source_height: 1.2
  # ---------- A-5: efeitos sintetizados, telegraph e diretor de áudio ----------
  # D-32 (docs/plano-construcao.md §7: main publicável, coisa pela metade atrás de flag em dados): o diretor
  # (audio/director.ts) só toca com true. Ligado depois da ligação em main.ts/hud.ts (V5) e dos stems do A-3 verdes
  # (tools/audio/e2e-director.mjs na CI). Com false, updateAudio/audioEvents não fazem nada e os bipes da fase 0
  # continuam por beep(). D-41 (docs/plano-construcao.md §7): ligado num commit isolado, revertível sozinho.
  director_enabled: true
  # Síntese PS1 pura (decisão do Rodrigo, 09/11/2026): todo efeito é sintetizado em tempo de execução a partir da
  # receita abaixo (zero arquivos, zero licença). Terror leve 12+ (GDD-v0.2 §1; docs/handoff/plano-audio-v5.md §2):
  # sem gritos, golpe = impacto abafado.
  # LACUNA (o GDD não define): ganho mínimo do envelope (a rampa exponencial não chega a 0). Proposta: 0,001
  # (−60 dB), o mesmo dos bipes do protótipo (audio/beeps.ts, `exponentialRampToValueAtTime(0.001, …)`).
  sfx_floor_gain: 0.001
  # LACUNA (o GDD não define): buffer de ruído branco gerado uma vez por contexto, duração (s) e semente do PRNG
  # (mulberry32 de packages/sim/src/rng.ts; semente fixa = mesmo ruído em toda sessão e nos testes). Proposta: 1 s, 1.
  noise_seconds: 1
  noise_seed: 1
  # LACUNA (o GDD não define): rampa linear (s) até o silêncio quando um telegraph é cancelado (atordoamento, preparo
  # que some sem efeito). Proposta: 0,03 s, curta para o corte soar imediato e longa o bastante para não estalar.
  sfx_cancel_ramp: 0.03
  # Catálogo de efeitos. Por efeito: kind (chave de voice_priority), bus (barramento do A-1), spatial (true = toca
  # na posição da fonte com HRTF e oclusão; false = som do próprio jogador/HUD, pos null), recipe (camadas somadas) e,
  # opcional, mod: intensidade 0–1 do chamador → multiplicador de ganho e de altura (freq e filtro), interpolados
  # linearmente entre [mín, máx].
  # Camada: type osc|noise; wave (osc); freq → freq_end (Hz, rampa exponencial ao longo da camada); filter
  # lowpass|highpass|bandpass com filter_freq → filter_end e q; attack (s, rampa linear até gain) e decay (s, rampa
  # exponencial até sfx_floor_gain); delay (s) do início; repeat (vezes) com gap (s) entre inícios.
  # Valores de timbre: LACUNA (o GDD só pede o efeito, GDD-v0.3 §11 e GDD-v0.2 §11); proposta da sessão Áudio,
  # para ajuste de ouvido pelo Rodrigo.
  sfx:
    # os 5 bipes da fase 0 (GameEvent "sound", packages/sim/src/types.ts; antigo SOUNDS de beeps.ts, valores do
    # protótipo: [freq, duração, volume]). A 1ª camada de cada um é o bipe original; beeps.ts SOUNDS deriva daqui.
    puzzle_ok: {kind: ui, bus: sfx, spatial: false, recipe: [{type: osc, wave: sine, freq: 660, attack: 0, decay: 0.1, gain: 0.2}]}
    puzzle_fail: {kind: ui, bus: sfx, spatial: false, recipe: [{type: osc, wave: sine, freq: 120, attack: 0, decay: 0.25, gain: 0.3}]}
    # golpe recebido: impacto abafado (baque grave + ruído passa-baixa curto), nada de som de carne
    hit:
      kind: event
      bus: sfx
      spatial: false
      recipe:
        - {type: osc, wave: sine, freq: 90, attack: 0, decay: 0.2, gain: 0.4}
        - {type: noise, filter: lowpass, filter_freq: 300, q: 0.7, attack: 0, decay: 0.08, gain: 0.15}
    # pontos do jogador local (GameEvent "points" com who = jogador; GDD-v0.2 §7.1): bipe curto de UI
    points: {kind: ui, bus: ui, spatial: false, recipe: [{type: osc, wave: sine, freq: 880, attack: 0, decay: 0.06, gain: 0.12}]}
    stun: {kind: hunter, bus: sfx, spatial: false, recipe: [{type: osc, wave: sine, freq: 200, attack: 0, decay: 0.15, gain: 0.3}]}
    bolt: {kind: event, bus: sfx, spatial: false, recipe: [{type: osc, wave: sine, freq: 300, attack: 0, decay: 0.12, gain: 0.3}]}
    # batimento: o duplo bipe do HUD (hud/hud.ts, beep(55, 0,12, 0,35) e 160 ms depois beep(48, 0,12, 0,25)).
    # Intensidade = proximidade do caçador (1 − d / prototype_extras.heartbeat.radius): mais perto, mais alto.
    heartbeat:
      kind: heartbeat
      bus: sfx
      spatial: false
      mod: {gain: [0.5, 1]}
      recipe:
        - {type: osc, wave: sine, freq: 55, attack: 0, decay: 0.12, gain: 0.35}
        - {type: osc, wave: sine, freq: 48, delay: 0.16, attack: 0, decay: 0.12, gain: 0.25}
    # telegraph por Windup.kind (GDD-v0.2 §4.1 "pista sonora única"; GDD-v0.3 §11 "som próprio que começa junto com
    # o telegraph visual"). Quatro assinaturas distintas: golpe = sopro que sobe + rosnado grave; dash = motor
    # serrilhado que acelera; projétil = três tiques agudos; armadilha = dois estalos metálicos.
    telegraph_melee:
      kind: telegraph
      bus: sfx
      spatial: true
      recipe:
        - {type: noise, filter: bandpass, filter_freq: 250, filter_end: 1200, q: 2, attack: 0.35, decay: 0.1, gain: 0.5}
        - {type: osc, wave: sine, freq: 70, freq_end: 50, attack: 0.3, decay: 0.15, gain: 0.3}
    telegraph_dash:
      kind: telegraph
      bus: sfx
      spatial: true
      recipe:
        - {type: osc, wave: sawtooth, freq: 70, freq_end: 280, filter: lowpass, filter_freq: 900, q: 1, attack: 0.3, decay: 0.12, gain: 0.25}
    telegraph_projectile:
      kind: telegraph
      bus: sfx
      spatial: true
      recipe:
        - {type: osc, wave: square, freq: 880, freq_end: 1320, filter: lowpass, filter_freq: 3000, q: 0.7, attack: 0.005, decay: 0.08, gain: 0.12, repeat: 3, gap: 0.12}
    telegraph_trap:
      kind: telegraph
      bus: sfx
      spatial: true
      recipe:
        - {type: osc, wave: triangle, freq: 1500, freq_end: 900, attack: 0.002, decay: 0.06, gain: 0.2, repeat: 2, gap: 0.18}
        - {type: noise, filter: highpass, filter_freq: 2500, q: 0.7, attack: 0.002, decay: 0.05, gain: 0.15, repeat: 2, gap: 0.18}
    # passos. Superfície: LACUNA — o sim não expõe superfície de chão (packages/sim/src/types.ts não tem campo nem
    # evento), então há uma só por ora; GDD-v0.2 §11 pede "passos por superfície" (pedido à Frente R adiado).
    step_hunter:
      kind: hunter
      bus: sfx
      spatial: true
      recipe:
        - {type: noise, filter: lowpass, filter_freq: 220, q: 0.7, attack: 0.005, decay: 0.18, gain: 0.6}
        - {type: osc, wave: sine, freq: 60, freq_end: 40, attack: 0, decay: 0.15, gain: 0.35}
    step_walk: {kind: footstep, bus: sfx, spatial: false, recipe: [{type: noise, filter: lowpass, filter_freq: 900, q: 0.7, attack: 0.003, decay: 0.07, gain: 0.18}]}
    step_run: {kind: footstep, bus: sfx, spatial: false, recipe: [{type: noise, filter: lowpass, filter_freq: 1400, q: 0.7, attack: 0.003, decay: 0.09, gain: 0.28}]}
    # respiração (GDD-v0.2 §11 "ligada à stamina"): intensidade = falta de stamina abaixo do limiar
    breath:
      kind: breath
      bus: sfx
      spatial: false
      mod: {gain: [0.4, 1], pitch: [1, 1.3]}
      recipe:
        - {type: noise, filter: bandpass, filter_freq: 700, filter_end: 500, q: 1.5, attack: 0.25, decay: 0.35, gain: 0.12}
    # zumbido do gerador (GDD-v0.2 §11 "timbre do gerador por progresso"): intensidade = n / puzzles_per_generator;
    # mais progresso = mais agudo (até 2×, uma oitava) e mais alto. Pulso redisparado a cada director.hum.period.
    generator_hum:
      kind: generator
      bus: sfx
      spatial: true
      mod: {gain: [0.4, 1], pitch: [1, 2]}
      recipe:
        - {type: osc, wave: sawtooth, freq: 55, filter: lowpass, filter_freq: 400, q: 2, attack: 0.25, decay: 0.75, gain: 0.12}
        - {type: osc, wave: sine, freq: 110, attack: 0.25, decay: 0.75, gain: 0.06}
    generator_done:
      kind: event
      bus: sfx
      spatial: true
      recipe:
        - {type: osc, wave: triangle, freq: 220, freq_end: 440, attack: 0.01, decay: 0.6, gain: 0.3}
        - {type: osc, wave: triangle, freq: 330, freq_end: 660, delay: 0.12, attack: 0.01, decay: 0.6, gain: 0.2}
    # resgate: arpejo de Ré maior (Ré–Fá♯–Lá), alívio sobre o Ré menor da música (audio.music.key)
    rescue:
      kind: event
      bus: sfx
      spatial: true
      recipe:
        - {type: osc, wave: sine, freq: 294, attack: 0.005, decay: 0.25, gain: 0.2}
        - {type: osc, wave: sine, freq: 370, delay: 0.12, attack: 0.005, decay: 0.25, gain: 0.2}
        - {type: osc, wave: sine, freq: 440, delay: 0.24, attack: 0.005, decay: 0.4, gain: 0.2}
    # prisão: grade de metal batendo (sem grito)
    cage:
      kind: event
      bus: sfx
      spatial: true
      recipe:
        - {type: osc, wave: square, freq: 110, freq_end: 70, filter: lowpass, filter_freq: 600, q: 1, attack: 0, decay: 0.5, gain: 0.3}
        - {type: noise, filter: bandpass, filter_freq: 1800, q: 4, attack: 0, decay: 0.25, gain: 0.2, repeat: 2, gap: 0.1}
  # Diretor (audio/director.ts): contínuos e transições por quadro. Batimento usa o que já existe:
  # prototype_extras.heartbeat (raio 20 m, intervalo base + (d / raio) × range_interval; P-03, o mesmo do HUD).
  director:
    # LACUNA (GDD-v0.3 §11 pede ducking de −8 dB "em eventos críticos", sem duração). Proposta: 1,5 s a partir do
    # golpe recebido ou da prisão (audio.music.duck_attack/duck_release fazem as rampas).
    duck_time: 1.5
    # LACUNA (o GDD não define cadência): metros por passo; a cadência sai da velocidade (passos/s = v / stride).
    # Proposta: caçador 2,0 m (altura 2,5 m: 1,55 passo/s a 3,1 m/s de patrulha, 2,15 a 4,3 em perseguição, 5,5 no
    # dash); jogador 1,6 m andando (2,5 passos/s a 4,0 m/s) e 1,9 m correndo (2,8 passos/s a 5,4 m/s).
    hunter_stride: 2.0
    # D-37 (docs/plano-construcao.md §7): além deste raio (m, do personagem visto) os sons posicionais do caçador
    # (step_hunter e telegraph_*) não tocam, para não virarem bússola (GDD-v0.3 §11: "sem enviar a posição do
    # caçador"). 30 m: logo além da camada de tensão (audio.music.tension_radius 25, GDD-v0.3 §11) e cobre todo
    # alcance de telegraph (hunter.dash.max 11, hunter.projectile.max 16, hunter.melee.range 1,8).
    hunter_audible_radius: 30
    walk_stride: 1.6
    run_stride: 1.9
    # LACUNA: deslocamento (m) num só quadro acima do qual é salto (gaiola, resgate a prototype_extras.rescued_offset
    # 2,5 m) e não passo. Proposta: 5 m (> dash 11 m/s × client.max_frame_dt 0,25 s = 2,75 m).
    teleport_dist: 5
    # LACUNA (GDD-v0.2 §11 "respiração ligada à stamina", sem limiar): liga abaixo desta fração de survivor.stamina.max;
    # período (s) de um ciclo [no limiar, com stamina 0]. Proposta: 0,35; 1,6 s → 0,9 s.
    breath: {stamina_below: 0.35, period: [1.6, 0.9]}
    # LACUNA: zumbido só de gerador com progresso (0 < n, não concluído) a até `radius` m do jogador, redisparado a
    # cada `period` s (a receita dura 1 s, os pulsos se sobrepõem). Proposta: 20 m (= heartbeat.radius), 0,8 s.
    hum: {radius: 20, period: 0.8}
  # ---------- A-6: legendas de som (audio/captions.ts) ----------
  # GDD-v0.3 §12.4 ("legendas de sons") e §11 (L218: "ícone direcional para passos de corrida, falha de gerador,
  # grito do caçador e resgate"): o diretor publica uma legenda quando o efeito correspondente de fato tocou (com som
  # cortado pelo raio da D-37 ou recusado pelo limite de vozes não há legenda). A direção é o setor de
  # `ui.threat_sectors` (GDD-v0.3 §12.1) relativo à câmera; a prioridade de cada legenda é a de voz do efeito
  # (`voice_priority[sfx[efeito].kind]`), sem tabela nova. O áudio entrega só dados (chave, categoria, setor); ícone,
  # cor e posição são da sessão Visual (docs/handoff/sessoes.md §2).
  captions:
    # D-39 (docs/plano-construcao.md §7): ligadas por padrão. Quem não ouve perderia o telegraph do caçador antes de
    # achar a opção; o custo visual é baixo (até max_on_screen rótulos curtos). Referências:
    # https://gameaccessibilityguidelines.com/ensure-subtitles-captions-are-or-can-be-turned-on-before-any-sound-is-played/
    # https://gameaccessibilityguidelines.com/provide-captions-or-visuals-for-significant-background-sounds/
    # https://gameaccessibilityguidelines.com/ensure-no-essential-information-is-conveyed-by-sounds-alone/
    enabled_default: true
    # D-40 (docs/plano-construcao.md §7): segundos na tela desde a última emissão, escolhidos no menu entre os
    # valores da lista (setCaptionDuration só aceita estes); padrão = durations[default_duration_index] = 3 s.
    durations: [3, 5, 8]
    default_duration_index: 0
    # LACUNA (o GDD não define): legendas simultâneas na tela; com a lista cheia, a nova derruba a de menor
    # prioridade (a mais antiga entre as empatadas) se a sua prioridade for maior ou igual, senão é descartada
    # (a mesma regra das vozes, A-4). Proposta: 3, o bastante para caçador + objetivo + evento sem cobrir o HUD.
    max_on_screen: 3
    # LACUNA (o GDD não define): a mesma chave emitida de novo, ainda na tela, funde com a legenda ativa (renova o
    # tempo, atualiza a direção, soma a contagem) em vez de abrir outra se vier do mesmo setor ou até `merge_window`
    # s depois da última emissão (de outro setor e mais tarde = outra fonte, outra legenda). Proposta: 1 s,
    # acima do intervalo entre passos do caçador (hunter_stride 2 m a 3,1 m/s = 0,65 s), que viram uma só legenda.
    merge_window: 1
    # efeito do catálogo `audio.sfx` → chave i18n `caption.*` e categoria. A categoria é o que a Visual usa para o
    # ícone direcional (GDD-v0.3 §11, L218) junto do setor, para a legenda não depender só de texto nem de cor
    # (WCAG 2.2, 1.3.3 e 1.4.1): hunter_steps (passos do caçador), hunter_attack (telegraph: "grito" do caçador vira
    # rosnado/preparo no terror leve 12+, GDD-v0.2 §1), generator (falha e conclusão), survivor (prisão e resgate).
    # Sem legenda, de propósito:
    #  - batimento (heartbeat): já é coberto pela seta de ameaça do HUD (GDD-v0.3 §12.1), que aparece com o caçador
    #    a < ui.threat_radius e dá o setor; legendar repetiria a mesma informação a cada batida;
    #  - respiração, zumbido do gerador, passos do próprio jogador, bipes de UI: retorno do que o próprio jogador faz,
    #    sem informação nova para quem não ouve.
    # LACUNA (passos de corrida, GDD-v0.3 §11 L218): o A-5 só toca os passos do caçador (posicionais) e os do próprio
    # jogador (sem posição); os de outros sobreviventes não tocam, logo não há legenda deles. Depende de o diretor
    # tocar esses passos.
    # LACUNA (falha de gerador): `puzzle_fail` chega como GameEvent "sound" só para a falha do jogador local, sem
    # posição (packages/sim/src/game.ts:178 e :183), então a legenda sai sem direção; a falha dos bots vira só ruído
    # de 18 m para o caçador (`noise`, GDD-v0.3 C-08), sem som. Pedido futuro à Frente R (sessoes.md §2): `sound` com
    # posição para a falha dos outros. Só anotado.
    effects:
      step_hunter: {key: caption.hunter_steps, category: hunter_steps}
      telegraph_melee: {key: caption.hunter_growl, category: hunter_attack}
      telegraph_dash: {key: caption.hunter_dash, category: hunter_attack}
      telegraph_projectile: {key: caption.hunter_projectile, category: hunter_attack}
      telegraph_trap: {key: caption.hunter_trap, category: hunter_attack}
      puzzle_fail: {key: caption.puzzle_fail, category: generator}
      generator_done: {key: caption.generator_done, category: generator}
      cage: {key: caption.cage, category: survivor}
      rescue: {key: caption.rescue, category: survivor}

# ---------- 16. UI (GDD-v0.3 §12) ----------
ui:
  threat_radius: 15                 # GDD-v0.3 §12.1: seta de ameaça a < 15 m (ou caçador revelado)
  threat_sectors: 8                 # GDD-v0.3 §12.1: só a direção, quantizada em 8 setores
  ping_types: [generator_here, hunter_here, need_help, going_to_rescue]   # GDD-v0.2 §12.1 (4 tipos)
  ping_cooldown: 2                  # GDD-v0.3 §12.1
  # LACUNA (GDD v0.2/v0.3 não definem): tempo que um ping fica visível. Proposta de 4 s, igual à marcação do
  # ping do Batedor (GDD-v0.2 §5.2); decisão do Rodrigo pendente.
  ping_lifetime: 4
  # Retrato "ferido" no HUD: lê survivor.wounded_hp (fonte única do limiar de ferido, GDD-v0.3 §8.3).
  fov: {min: 60, max: 100, default: 75}
  tutorial_time: 60
  ftue_target_min: 10
  min_contrast: 4.5
  locales: [pt-BR, en, es]
  # ---- V8b: faixa de legendas de som no HUD (GDD-v0.3 §12.4, §11 L218; dados de audio.captions, A-6) ----
  # LACUNA (GDD e Art Bible não definem a saída da legenda). Proposta: esmaecer nos últimos 0,5 s em 5 degraus (no
  # máximo 5 escritas de estilo por legenda, nada por quadro); com "reduzir flicker" some sem esmaecer
  captions: {fade: 0.5, opacity_steps: 5}
  # D-45: a partida só começa com os personagens carregados (charactersReady); teto da espera em s, depois do qual a
  # partida começa com o modelo de reserva (render.models.fallback), para um download travado não prender o jogo
  start_wait_s: 10
  # ---- V8 (F2-08): menu de opções, controles e acessibilidade (GDD-v0.3 §12.2 e §12.4) ----
  options:
    # passo dos sliders de intensidade (render.ps1.*, render.layer_a.*: 0 a 1, GDD-v0.3 §10.1 e §10.2) e de volume
    # (audio.buses, ganho linear 0 a 1, A-1). LACUNA (GDD não define o passo). Proposta: 0,05 (20 posições)
    intensity_step: 0.05
    fov_step: 1                     # graus; faixa em ui.fov (GDD-v0.3 §12.2: 60 a 100)
    # "fonte em 3 tamanhos" (GDD-v0.3 §12.4): escala aplicada a todo texto da interface (fonte monoespaçada atual;
    # a fonte pixel OFL é LACUNA da Art Bible §8). LACUNA (GDD e Art Bible não definem os tamanhos). Proposta:
    # 100%, 125% e 150% (WCAG 2.2 1.4.4 pede texto legível até 200%; o zoom do navegador cobre o resto)
    font_scales: {normal: 1, large: 1.25, xlarge: 1.5}
    font_default: normal
    # "redução de balanço de câmera" (GDD-v0.3 §12.4): multiplicador de render.retro.bob com a opção ligada (0 = zera)
    reduced_bob: 0
  # GDD-v0.3 §12.2: remapeamento de todas as ações, sensibilidade e inversão do eixo Y
  controls:
    mouse_rad_per_px: 0.0025        # rad por pixel de mouse com sensibilidade 1 (prototype/the-hell.html L114)
    pitch_limit: 1.2                # rad, limite do olhar para cima e para baixo (prototype/the-hell.html L114)
    key_turn_speed: 2               # rad/s girando com as setas ← → (prototype/the-hell.html L136)
    # LACUNA (GDD-v0.3 §12.2 pede sensibilidade, sem faixa). Proposta: 0,25× a 3× da sensibilidade do protótipo
    sensitivity: {min: 0.25, max: 3, default: 1, step: 0.05}
    invert_y: false
    # teclado padrão (KeyboardEvent.code): os mesmos do protótipo (GDD-v0.2 §12.2, prototype/the-hell.html L109–L113)
    # e os pings 1–4 do R7 (GDD-v0.3 §12.1). `attack` também sai pelo clique do mouse (GDD-v0.2 §12.2); sem tecla
    # padrão para não mudar os controles da fase 0 (o jogador pode atribuir uma no menu)
    keyboard:
      forward: [KeyW]
      back: [KeyS]
      left: [KeyA]
      right: [KeyD]
      run: [ShiftLeft, ShiftRight]
      interact: [KeyE]
      ability: [KeyQ]
      attack: []
      camera: [KeyV]
      look_left: [ArrowLeft]
      look_right: [ArrowRight]
      puzzle_confirm: [Space]
      ping_1: [Digit1]
      ping_2: [Digit2]
      ping_3: [Digit3]
      ping_4: [Digit4]
      mute: [KeyM]                  # mudo do volume geral (D-41, audio/mute.ts); sem botão padrão no gamepad
    # "alternar em vez de segurar" (GDD-v0.3 §12.4): padrão desligado (segurar, como no protótipo)
    toggle_run: false
    toggle_interact: false
    # gamepad no layout "standard" da Gamepad API (GDD-v0.3 §12.2; índices em https://w3c.github.io/gamepad/#remapping:
    # botões 0 A/Cruz, 1 B/Círculo, 2 X/Quadrado, 3 Y/Triângulo, 4 LB, 5 RB, 6 LT, 7 RT, 8 Select, 9 Start, 10 L3,
    # 11 R3, 12–15 direcional ↑ ↓ ← →; eixos 0/1 analógico esquerdo x/y, 2/3 direito x/y, negativo = esquerda/cima).
    # LACUNA (GDD não define qual botão faz o quê). Proposta: a escolha abaixo, no padrão de jogos de terror
    # assimétrico em console (A interage, gatilho direito ataca, gatilho esquerdo corre); decisão do Rodrigo pendente
    gamepad:
      deadzone: 0.25                # fração do curso do analógico ignorada (LACUNA; proposta)
      look_speed: 2.5               # rad/s com o analógico direito no fim do curso (LACUNA; proposta)
      trigger_threshold: 0.5        # gatilho analógico conta como apertado a partir desta fração (LACUNA; proposta)
      menu_stick: 0.5               # analógico esquerdo vira direção nos menus a partir desta fração (LACUNA; proposta)
      axes: {move_x: 0, move_y: 1, look_x: 2, look_y: 3}
      # em partida; no quebra-cabeça: `interact` confirma (timing), `puzzle_exit` sai e o direcional dá as setas
      buttons: {interact: 0, puzzle_exit: 1, ability: 3, attack: 7, run: 6, camera: 11, ping_1: 12, ping_2: 15, ping_3: 13, ping_4: 14}
      # menus: direcional move o foco, ← → ajustam slider; A ativa; B volta (= Esc)
      menu: {confirm: 0, back: 1, up: 12, down: 13, left: 14, right: 15}
      # repetição ao segurar uma direção no menu (s): primeira repetição e intervalo (LACUNA; proposta)
      menu_repeat: {delay: 0.4, interval: 0.12}

# ---------- Laço do cliente (GDD-v0.3 §13.3: passo fixo de 1/60 s) ----------
# O laço acumula o tempo real do quadro e roda quantos passos de 1/60 s couberem, para a partida andar em
# tempo real mesmo com quadro lento (o limite de 600 s do §3.3 revisto e a simulação do servidor, C-11, correm em
# tempo real). O protótipo limitava o quadro a 0,05 s (prototype/the-hell.html L202), o que põe a partida em câmera
# lenta abaixo de 20 fps (docs/prototipo-paridade.md P-13). Tetos contra a "espiral da morte" (quadro longo, como
# ao voltar de uma aba em segundo plano): o tempo de um quadro vale no máximo max_frame_dt e cada quadro roda no
# máximo max_steps_per_frame passos; o que passar disso é descartado.
client:
  max_frame_dt: 0.25                # s (4 fps); padrão de "Fix Your Timestep!" (Glenn Fiedler, gafferongames.com)
  max_steps_per_frame: 15           # = 0,25 s × 60 Hz
  # Mouse da câmera (packages/client/src/pointer-filter.ts). Bug: ao adquirir o pointer lock (clique em "#go") o
  # Chromium pode emitir um mousemove com movementX espúrio (medido ≈ −568 px, o clientX do cursor) e a câmera saltava
  # ≈ 1,4 rad. A primeira leitura de cada lock já é descartada; além disso, um evento isolado com |movementX| ou
  # |movementY| acima deste limite é ignorado. D-47 (docs/plano-construcao.md §7; GDD v0.2/v0.3 não definem): 300 px por evento
  # (o Chromium agrupa o mousemove por quadro, https://developer.chrome.com/blog/aligning-input-events: a 60 Hz
  # equivale a 18.000 px/s, acima de um giro rápido real).
  mouse_max_delta: 300              # px por evento

# ---------- 17. Rede (GDD-v0.3 §13.4) ----------
net:
  sim_step_hz: 60
  server_tick_hz: 30
  snapshot_hz: 20
  input_hz: 60
  interp_buffer_ms: 100
  lag_comp_max_ms: 150
  pos_quant: 64                     # 1/64 m
  angle_bits: 8
  budget_kbps_per_client: 20
  playable_ping_ms: 150
  warn_ping_ms: 200
  reconnect_s: 30
  max_clients_per_room: 6

# ---------- 18. Simulador e porta de regressão (GDD-v0.3 C-15, D-05 a, D-16 a; GDD-v0.2 §7.6; item R5) ----------
# Bots não representam pessoas (lição do Caçada Sombria, C-15): o simulador é PORTA DE REGRESSÃO, não de banda.
# `pnpm sim:check` joga `check.matches_per_group` partidas por dificuldade em cada mapa, sementes `check.seed` em
# diante (as mesmas da linha de base data/sim/baseline.json), e reprova se uma métrica piorar mais que a tolerância
# (piora máxima ABSOLUTA, na unidade da métrica: fração 0..1, segundos ou capturas por partida). `max_worsening` vale
# nos grupos de 1 dificuldade; `pooled_max_worsening`, no agregado "mapa/all" (4× mais partidas, ruído menor).
# Direção de piora: `higher` = subir é piorar; `lower` = descer é piorar; `band` = afastar-se da banda do §7.6 é
# piorar, e passar para o OUTRO lado da banda conta a distância nova inteira como piora (0% → 100% de vitória do
# caçador numa banda de 45–55% = 45 p.p.). A banda só define a direção; ela vira porta só depois da calibração com
# pessoas (D-05). Métricas fora daqui só são medidas: survivor_escape (D-16 a) e duration_median. Travas (T-03),
# exceções, partidas sem fim e transições fora do grafo do §8.2 reprovam sempre. Tolerância null = "a medir".
# Exceção à regra "só piora relativa": `floor` (só em `worse: lower`) é um PISO ABSOLUTO de aceite, que reprova pelo
# valor atual mesmo sem linha de base ou com tolerância a medir, só nos grupos das dificuldades de `floor_groups` (o
# agregado "mapa/all" não entra) e quando o grupo tiver ≥ min_samples (marco MJ-B).
# Tolerâncias = 3 × √2 × maior desvio-padrão medido entre 10 lotes do check com sementes disjuntas (1..500), arredondado
# para cima; desvio 0 → resolução de 1 partida (1/50 por dificuldade, 1/200 no agregado); chase_median só usa lotes
# com ≥ min_samples episódios. Medição refeita no marco MJ-B (09/11/2026, `pnpm sim --check --noise=10 --workers=2`,
# padrões novos: ruleset v1, hunter_brain utility com a D-35 e a D-36, bot_brain competent do R4, grade A*, D-21
# ligada). Desvio máx por dificuldade / no agregado: hunter_win 0,0527 (Pesadelo) / 0,0115; duration_mean 11,87 s /
# 4,38 s; captures_per_match 0,107 / 0,0454; short_match_rate 0,0444 / 0,0148; chases_per_match 0,110 / 0,0459;
# chase_median 9,01 s (Difícil; Fácil e Normal com < 10 episódios por lote, não entram) / 2,26 s.
# PORTA HOJE (bots competentes; base de 09/11/2026; a tabela do check marca "saturada"): hunter_win (0–14% por
# dificuldade, 4% no agregado) fica a menos de 1 tolerância do 0 em todos os grupos, então só reprova se passar do
# outro lado da banda (porta inativa até o R8); capturas e perseguições perto de 0 saturam em Fácil e Normal e vigiam
# em Difícil, Pesadelo e no agregado; duration_mean e short_match_rate vigiam em todos. chase_median: por dificuldade
# a tolerância (39 s) passa da base (não vigia); no agregado vigia a tolerância (10 s). O piso de 15 s só vale no
# Normal (GDD-v0.3 §8.5: "contra o caçador Normal"; Fácil fica abaixo, ex.: 4,1 s com 13 episódios no noturno, e não
# reprova). O check de 200 partidas NÃO ativa o piso no Normal (3 episódios < min_samples): só o noturno vigia
# (2.500 partidas por dificuldade; ~64 episódios a cada 1.000 partidas no Normal, mediana 18,5 s).
# Ao regravar a linha de base com outro comportamento (R7-mapas, R8), medir de novo e revisar estes valores no mesmo PR.
sim:
  short_match_seconds: 180          # §7.6: "partidas encerradas em menos de 3 min"
  check: {matches_per_group: 50, seed: 1, difficulties: [easy, normal, hard, nightmare]}  # 200 partidas no Pátio
  nightly: {matches_per_group: 2500} # 4 dificuldades × 2.500 = 10.000 partidas por mapa (GDD-v0.2 §15.2)
  # R8 passo 1 (pnpm sim --check --noise=10, 09/11/2026): o desvio entre lotes de 50 partidas no Pesadelo subiu para
  # 0,146 capturas e 0,136 perseguições por partida (3 × √2 × desvio = 0,62 e 0,58); as outras tolerâncias seguem acima
  # do sugerido e ficam como estavam.
  regression:
    hunter_win:         {worse: band, band: [0.45, 0.55], max_worsening: 0.23, pooled_max_worsening: 0.05}   # §7.6 + D-16 a
    duration_mean:      {worse: band, band: [360, 480], max_worsening: 51, pooled_max_worsening: 19}         # §7.6: 6 a 8 min (s)
    captures_per_match: {worse: band, band: [1.5, 2.5], max_worsening: 0.62, pooled_max_worsening: 0.20}     # §7.6
    short_match_rate:   {worse: higher, max_worsening: 0.20, pooled_max_worsening: 0.07}                     # §7.6: < 5%
    # GDD-v0.3 §8.5 (aceite: mediana ≥ 15 s "contra o caçador Normal"): piso absoluto de 15 s só no Normal; com < 10
    # episódios a mediana oscila > 12 s entre lotes, então nem a tolerância nem o piso comparam o grupo.
    chase_median:       {worse: lower, floor: 15, floor_groups: [normal], max_worsening: 39, pooled_max_worsening: 10, min_samples: 10}
    # vigia um defeito que zere as perseguições (por partida, para o noturno de 10.000 comparar com a base de 200)
    chases_per_match:   {worse: lower, max_worsening: 0.58, pooled_max_worsening: 0.20}
