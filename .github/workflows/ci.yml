name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# Em PRs, um push novo cancela o run anterior. Em main nunca: cancelar ali interrompe o deploy de staging.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    name: Testes, build e fumaça
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.1 # v6.1.1 (03/11/2026) tem menos de 2 semanas
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # créditos antes do ffmpeg: não dependem dele, e em passo próprio a falha do loudness não esconde a de créditos
      - name: "Áudio: créditos de public/audio em creditos.csv (A-7)"
        run: node tools/audio/loudness.mjs --credits
      - name: "Áudio: ffmpeg (stems A-3 e loudness A-7)"
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg; fi
          ffmpeg -version | head -1
      - name: "Áudio: loudness da música (−16 LUFS ±1, ≤ −1 dBTP) (A-7)"
        run: node tools/audio/loudness.mjs
      - name: Testes com cobertura (sim ≥ 90%)
        run: pnpm coverage
      - name: Paleta (contraste e daltonismo)
        run: pnpm check:palette
      - name: Validador de mapa (GDD v0.3 §9.1, todas as combinações de layout)
        run: pnpm maps:validate
      - name: Porta de regressão do simulador (200 partidas contra data/sim/baseline.json; GDD v0.3 C-15, D-05)
        run: pnpm sim:check --workers=2
      - name: Traduções pt-BR, en e es (GDD v0.3 §12.5)
        run: pnpm i18n:check
      - run: pnpm build
      - name: Modelos (glTF-Validator, triângulos e clipes por personagem)
        run: node tools/assets/validate.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - name: WASM do recast no navegador (build do Vite, mesmo navmesh que o Node)
        run: pnpm maps:browser-check
      - name: Fumaça ponta a ponta (servidor + jogo no navegador)
        run: pnpm smoke
      - name: "D-45: partida só começa com os personagens (.glb do caçador atrasado 6 s e com falha)"
        run: pnpm e2e:espera-personagens
      - name: "Áudio: contexto inicia após o clique (A-1)"
        run: node tools/audio/e2e.mjs
      - name: "Áudio: stems decodificados no Chromium com comprimento exato e loop sem estalo (A-3)"
        run: node tools/audio/check-loop.mjs
      - name: "Áudio: diretor no laço real (stems sob demanda, música, telegraph no quadro do visual, legenda)"
        run: node tools/audio/e2e-director.mjs
      - name: Acessibilidade dos menus e fluxo de telas (axe-core, GDD v0.3 §12.4)
        run: pnpm a11y
      - name: Fumaça do protótipo original
        run: pnpm smoke:prototype
      - name: Capturas de referência do material PS1 (V1) e das camadas A, B e C por preset (V4)
        run: node tools/visual/compare.mjs --out "$RUNNER_TEMP/visual"
      # na falha, publica as capturas atuais e os mapas de diferença (*.diff.png) para revisão
      - name: Publicar capturas e diferenças
        if: failure()
        uses: actions/upload-artifact@v7.0.2 # tag de 07/10/2026 (≥ 2 semanas)
        with:
          name: capturas-visuais
          path: ${{ runner.temp }}/visual
          if-no-files-found: ignore
          retention-days: 14
      # cena de pior caso (?stress=1) em cada preset: draw calls e triângulos; download inicial; tempo até jogar
      # (relógio só reportado no SwiftShader; ver tools/perf/budget.mjs)
      - name: Orçamentos de desempenho (V7, GDD v0.3 §10.6)
        run: pnpm perf:budget --out "$RUNNER_TEMP/perf"
      - name: Publicar relatório dos orçamentos
        if: failure()
        uses: actions/upload-artifact@v7.0.2 # tag de 07/10/2026 (≥ 2 semanas)
        with:
          name: orcamentos-desempenho
          path: ${{ runner.temp }}/perf
          if-no-files-found: ignore
          retention-days: 14
  secrets:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  deploy-staging:
    name: Deploy em staging
    needs: [test, secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: { group: deploy-staging, cancel-in-progress: false }
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
        if: env.FLY_API_TOKEN != ''
      - run: flyctl deploy --config fly.staging.toml --remote-only --build-arg APP_VERSION=${{ github.sha }}
        if: env.FLY_API_TOKEN != ''
      - run: curl -fsS https://the-hell-staging.fly.dev/healthz
        if: env.FLY_API_TOKEN != ''
      - run: echo "FLY_API_TOKEN não configurado — deploy de staging feito pela sessão (docs/runbook.md)."
        if: env.FLY_API_TOKEN == ''
