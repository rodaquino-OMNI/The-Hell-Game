name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# Em PRs, um push novo cancela o run anterior. Em main nunca: cancelar ali interrompe o deploy de staging.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    name: Testes, build e fumaça
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0 # v6.1.1 (03/11/2026) tem menos de 2 semanas
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Testes com cobertura (sim ≥ 90%)
        run: pnpm coverage
      - name: Paleta (contraste e daltonismo)
        run: pnpm check:palette
      - name: Validador de mapa (GDD v0.3 §9.1, todas as combinações de layout)
        run: pnpm maps:validate
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Fumaça ponta a ponta (servidor + jogo no navegador)
        run: pnpm smoke
      - name: Fumaça do protótipo original
        run: pnpm smoke:prototype
      - name: Capturas de referência do material PS1 (V1)
        run: node tools/visual/compare.mjs --out "$RUNNER_TEMP/visual"
  secrets:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  deploy-staging:
    name: Deploy em staging
    needs: [test, secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: { group: deploy-staging, cancel-in-progress: false }
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
        if: env.FLY_API_TOKEN != ''
      - run: flyctl deploy --config fly.staging.toml --remote-only --build-arg APP_VERSION=${{ github.sha }}
        if: env.FLY_API_TOKEN != ''
      - run: curl -fsS https://the-hell-staging.fly.dev/healthz
        if: env.FLY_API_TOKEN != ''
      - run: echo "FLY_API_TOKEN não configurado — deploy de staging feito pela sessão (docs/runbook.md)."
        if: env.FLY_API_TOKEN == ''
