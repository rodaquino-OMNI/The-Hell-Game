name: Fumaça do staging
# Portão de publicação (D-32, D-42): roda tools/smoke.mjs N vezes seguidas contra uma URL já publicada
# (staging por padrão; produção depois do deploy), num runner limpo. Falha se qualquer execução falhar; sem retry.
# Os logs e as capturas de cada execução ficam como artefato.
# Gatilhos: (1) manual; (2) push de tag `fumaca-staging-*` (20 execuções; a integração das sessões não pode
# disparar workflow_dispatch, ver docs/runbook.md); (3) depois de cada CI verde em main, que já fez o deploy de
# staging (5 execuções, para não pesar nos minutos de runner).
on:
  push:
    tags: ["fumaca-staging-*"]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      url:
        description: "URL do jogo"
        default: "https://the-hell-staging.fly.dev"
        type: choice
        options: ["https://the-hell-staging.fly.dev", "https://the-hell.fly.dev"]
      runs:
        description: "Execuções seguidas (1–50)"
        default: "20"
        type: string
permissions:
  contents: read
concurrency:
  group: smoke-remote
  cancel-in-progress: false
jobs:
  smoke:
    name: Fumaça repetida contra a URL publicada
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    env:
      # entradas só existem no disparo manual; tag → 20 execuções; depois da CI → 5
      ALVO: ${{ inputs.url || 'https://the-hell-staging.fly.dev' }}
      VEZES: ${{ inputs.runs || (github.event_name == 'push' && '20') || '5' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-17)
      # v6.1.1 (tag de 2026-11-03) tinha menos de 2 semanas em 2026-11-09 (regra 6): fixado em v6.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (2026-09-05)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (2026-10-08)
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Versão servida
        env: { URL: "${{ env.ALVO }}" }
        run: curl -fsS "$URL/healthz" | tee "$RUNNER_TEMP/healthz.json"
      - name: Fumaça × N
        env:
          URL: ${{ env.ALVO }}
          RUNS: ${{ env.VEZES }}
        run: |
          case "$RUNS" in ''|*[!0-9]*) echo "runs inválido: $RUNS"; exit 1;; esac
          if [ "$RUNS" -lt 1 ] || [ "$RUNS" -gt 50 ]; then echo "runs fora de 1–50: $RUNS"; exit 1; fi
          out="$RUNNER_TEMP/fumaca"; mkdir -p "$out"; ok=0; fail=0
          for i in $(seq 1 "$RUNS"); do
            if node tools/smoke.mjs "$out/captura-$i.png" "$URL" > "$out/log-$i.txt" 2>&1; then
              ok=$((ok+1)); echo "execução $i: ok"
            else
              fail=$((fail+1)); echo "::error::execução $i falhou"; tail -n 20 "$out/log-$i.txt"
            fi
          done
          echo "Fumaça contra $URL: $ok/$RUNS ok" | tee "$out/resumo.txt" >> "$GITHUB_STEP_SUMMARY"
          [ "$fail" -eq 0 ]
      - name: Publicar logs e capturas
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (2026-10-07)
        with:
          name: fumaca-remota
          path: |
            ${{ runner.temp }}/fumaca
            ${{ runner.temp }}/healthz.json
          if-no-files-found: ignore
          retention-days: 14
