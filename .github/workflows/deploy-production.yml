# Deploy em produção: só manual, disparado pelo Rodrigo (portão humano, plano §5).
name: Deploy produção
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Digite PRODUCAO para confirmar"
        required: true
permissions:
  contents: read
concurrency: { group: deploy-production, cancel-in-progress: false }
jobs:
  deploy:
    if: github.event.inputs.confirm == 'PRODUCAO'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
      - run: flyctl deploy --config fly.production.toml --remote-only --build-arg APP_VERSION=${{ github.sha }}
      - run: curl -fsS https://the-hell.fly.dev/healthz
