# Simulador noturno (item R5; GDD-v0.2 §15.2, GDD-v0.3 C-15 e D-05 a): 10.000 partidas (`sim.nightly` em
# data/balance.yaml), comparadas com a linha de base data/sim/baseline.json pelas tolerâncias de `sim.regression`.
# Relatório Markdown e JSON como artefato. Abre issue SÓ se o simulador detectar regressão (métrica pior que a
# tolerância, trava, exceção, partida sem fim ou transição fora do grafo); falha da própria ferramenta não abre issue.
# Se já houver issue aberta com o mesmo prefixo de título, comenta nela em vez de abrir outra.
# Runner de repositório público: 4 vCPU (--workers=4).
name: Simulador noturno
on:
  schedule:
    - cron: "17 6 * * *" # 03:17 em Brasília
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sim-nightly
  cancel-in-progress: false
jobs:
  sim:
    name: 10.000 partidas contra a linha de base
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      regression: ${{ steps.sim.outputs.regression }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-17)
      # v6.1.1 (tag de 2026-11-03) tinha menos de 2 semanas em 2026-11-09 (regra 6): fixado em v6.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (2026-09-05)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (2026-10-08)
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm data
      - name: Simulador (pnpm sim:nightly)
        id: sim
        run: |
          out="$RUNNER_TEMP/sim"
          mkdir -p "$out"
          set +e
          pnpm sim:nightly --workers=4 --json="$out/nightly.json" --md="$out/nightly.md" | tee "$out/console.txt"
          code=${PIPESTATUS[0]}
          set -e
          # regressão = o simulador terminou e marcou `failed` no JSON; sem JSON (a ferramenta quebrou) não abre issue
          if [ -f "$out/nightly.json" ] && jq -e '.failed == true' "$out/nightly.json" > /dev/null; then
            echo "regression=true" >> "$GITHUB_OUTPUT"
          else
            echo "regression=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f "$out/nightly.md" ]; then cat "$out/nightly.md" >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$code"
      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (2026-10-07)
        with:
          name: simulador-noturno
          path: ${{ runner.temp }}/sim
          if-no-files-found: ignore
          retention-days: 30
  issue:
    name: Abrir issue de regressão
    needs: sim
    if: always() && needs.sim.outputs.regression == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Abrir issue ou comentar na aberta
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          prefix="Simulador noturno: regressão detectada"
          body="O simulador noturno (10.000 partidas, \`pnpm sim:nightly\`) reprovou contra \`data/sim/baseline.json\` com as tolerâncias de \`sim.regression\` (data/balance.yaml; GDD-v0.3 C-15, D-05 a).

          Commit: ${GITHUB_SHA}
          Execução, resumo e artefato \`simulador-noturno\` (relatório Markdown e JSON): ${RUN_URL}

          Se a mudança de comportamento for intencional, a linha de base se atualiza em PR explícito com o relatório antes/depois (cabeçalho de tools/sim/run.ts)."
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" \
            --jq "[.[] | select(.pull_request == null and (.title | startswith(\"$prefix\")))][0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$prefix ($(date -u +%Y-%m-%d), ${GITHUB_SHA::7})" \
              --body "$body"
          fi
